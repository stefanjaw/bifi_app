<h1 class="text-2xl font-bold mb-4">{{ 'maintenanceWindows' | translate: {} : 'asset-roster' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNewMaintenanceWindow' | translate: {} : 'asset-roster'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'maintenance-windows/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByNameRecurrency' | translate: {} : 'asset-roster'"
  [searchFilters]="maintenanceWindowFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'asset-roster'"
  [columns]="maintenanceWindowColumns"
  [data]="maintenanceWindows"
  [onClickRow]="goToEditMaintenanceWindow"
  clickRowPermission="maintenance-windows/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteMaintenanceWindow(row._id)"
      resource="maintenance-windows"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
