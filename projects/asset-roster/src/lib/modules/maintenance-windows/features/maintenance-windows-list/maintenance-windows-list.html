<h1 class="text-2xl font-bold mb-4">Maintenance Windows</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Maintenance Window"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'maintenance-windows/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name and recurrency"
  [searchFilters]="maintenanceWindowFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="maintenanceWindowColumns" [data]="maintenanceWindows" [onClickRow]="goToEditMaintenanceWindow" clickRowPermission="maintenance-windows/update:view"   >
  <ng-template #actions let-row>

      (onClick)="deleteMaintenanceWindow(row._id)"
