@let scope = 'asset-roster';

<h1 class="text-2xl font-bold mb-4">{{ 'conditions' | translate: {} : scope }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNewCondition' | translate: {} : scope"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'asset-conditions/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchConditions' | translate: {} : scope"
  [searchFilters]="assetConditionFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'asset-roster'"
  [columns]="assetConditionColumns"
  [data]="assetConditions"
  [onClickRow]="gotoEditAssetCondition"
  clickRowPermission="asset-conditions/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteAssetCondition(row._id)"
      resource="asset-conditions"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
