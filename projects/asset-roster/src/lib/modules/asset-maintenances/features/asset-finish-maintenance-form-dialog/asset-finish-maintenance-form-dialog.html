<p-dialog
  [header]="
    'Complete ' +
    (maintenanceType() === 'service' ? 'Service' : 'PM') +
    ' for ' +
    assetRoster()?.productModel
  "
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <p [bifiAppText]="'small'" class="font-bold!">
      Comfirm completion of {{ assetMaintenace()?.name }} initiated on:
      {{ assetMaintenace()?.dateStart | date }}
    </p>

    <bifi-app-form-field>
      <bifi-app-form-label>Notes</bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="notes"
        type="text"
        placeholder="Eg. No issues"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-field>
      <bifi-app-form-label>Service Cost (Optional)</bifi-app-form-label>
      <p-inputnumber
        formControlName="cost"
        mode="currency"
        currency="USD"
        locale="en-US"
        [min]="0"
        placeholder="e.g., 250.00"
        class="w-full"
      ></p-inputnumber>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-uploader formArrayName="attachments">
      <p-fileUpload
        showUploadButton="false"
        showCancelButton="false"
        name="files"
        [multiple]="false"
        accept="application/*"
        maxFileSize="100000000"
        mode="basic"
      ></p-fileUpload>
    </bifi-app-form-uploader>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      saveLabel="Confirm {{ maintenanceType() === 'service' ? 'Service' : 'PM' }} Done"
      cancelLabel="Cancel"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
