<p-dialog
  [header]="
    (maintenanceType() === 'service' ? 'completeService' : 'completePm')
      | translate: {} : 'asset-roster'
  "
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <p [bifiAppText]="'small'" class="font-bold!">
      {{ 'confirmCompletionOf' | translate: {} : 'asset-roster' }} {{ assetMaintenace()?.name }}
      {{ 'initiatedOn' | translate: {} : 'asset-roster' }}:
      {{ assetMaintenace()?.dateStart | date }}
    </p>

    <bifi-app-form-field>
      <bifi-app-form-label>{{ 'notes' | translate: {} : 'asset-roster' }}</bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="notes"
        type="text"
        [placeholder]="'egNoIssues' | translate: {} : 'asset-roster'"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-field>
      <bifi-app-form-label>
        {{ 'serviceCostOptional' | translate: {} : 'asset-roster' }}
      </bifi-app-form-label>
      <p-inputnumber
        formControlName="cost"
        mode="currency"
        currency="USD"
        locale="en-US"
        [min]="0"
        placeholder="e.g., 250.00"
        class="w-full"
      ></p-inputnumber>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-uploader formArrayName="attachments">
      <p-fileUpload
        showUploadButton="false"
        showCancelButton="false"
        name="files"
        [multiple]="false"
        accept="application/*"
        maxFileSize="100000000"
        mode="basic"
      ></p-fileUpload>
    </bifi-app-form-uploader>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      [saveLabel]="
        (maintenanceType() === 'service' ? 'confirmServiceDone' : 'confirmPmDone')
          | translate: {} : 'asset-roster'
      "
      [cancelLabel]="'cancel' | translate: {} : 'asset-roster'"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
