<!-- eslint-disable @angular-eslint/template/click-events-have-key-events
 -->

<p-dialog
  [header]="'performService' | translate: {} : 'asset-roster'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <p [bifiAppText]="'small'" class="font-bold!">
      {{ assetRoster()?.assetTypeIds?.[0]?.name || 'No type' }} -
      {{ assetRoster()?.productModel }} (S/N: {{ assetRoster()?.serialNumber }})
    </p>

    <bifi-app-form-field>
      <bifi-app-form-label>
        {{ 'typeOfService' | translate: {} : 'asset-roster' }}
      </bifi-app-form-label>
      <div class="flex flex-wrap md:flex-nowrap gap-4">
        <div
          class="flex items-center w-full md:w-50 shadow p-3 rounded-md"
          (click)="calibration.select($event)"
        >
          <p-radiobutton
            #calibration
            value="calibration"
            formControlName="name"
            inputId="calibration"
          />
          <label for="calibration" [bifiAppText]="'small'" class="ml-2">
            {{ 'calibration' | translate: {} : 'asset-roster' }}
          </label>
        </div>

        <div
          class="flex items-center w-full md:w-50 shadow p-3 rounded-md"
          (click)="verification.select($event)"
        >
          <p-radiobutton
            #verification
            value="verification"
            formControlName="name"
            inputId="verification"
          />
          <label for="verification" [bifiAppText]="'small'" class="ml-2">
            {{ 'verification' | translate: {} : 'asset-roster' }}
          </label>
        </div>
      </div>
      <div class="flex flex-wrap md:flex-nowrap gap-4">
        <div
          class="flex items-center w-full md:w-50 shadow p-3 rounded-md"
          (click)="unscheduledMaintenance.select($event)"
        >
          <p-radiobutton
            #unscheduledMaintenance
            value="unscheduled-maintenance"
            formControlName="name"
            inputId="unscheduled-maintenance"
          />
          <label for="unscheduled-maintenance" [bifiAppText]="'small'" class="ml-2">
            {{ 'unscheduledMaintenance' | translate: {} : 'asset-roster' }}
          </label>
        </div>

        <div
          class="flex items-center w-full md:w-50 shadow p-3 rounded-md"
          (click)="repair.select($event)"
        >
          <p-radiobutton #repair value="repair" formControlName="name" inputId="repair" />
          <label for="repair" [bifiAppText]="'small'" class="ml-2">
            {{ 'repair' | translate: {} : 'asset-roster' }}
          </label>
        </div>
      </div>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-field>
      <bifi-app-form-label>
        {{ 'serviceDetailsReason' | translate: {} : 'asset-roster' }}
      </bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="description"
        type="text"
        [placeholder]="'describeServiceReason' | translate: {} : 'asset-roster'"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      [cancelLabel]="'cancel' | translate: {} : 'asset-roster'"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
