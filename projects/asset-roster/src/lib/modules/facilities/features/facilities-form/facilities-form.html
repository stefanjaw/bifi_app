<bifi-app-form-layout
  title="{{ isUpdate() ? 'Update' : 'Create' }} Facility"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section title="General information" id="general-info" [ordinal]="1">
        <section class="w-full grid gap-3 sm:grid-cols-2">
          <bifi-app-form-field class="mb-3">
            <bifi-app-form-label>Name</bifi-app-form-label>
            <input pInputText formControlName="name" type="text" placeholder="Name" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Related to contact</bifi-app-form-label>
            <p-select
              formControlName="contactId"
              [options]="contacts()"
              optionLabel="name"
              optionValue="_id"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </section>
      </bifi-app-form-section>
      <bifi-app-form-section title="Rooms Preview" id="rooms" [ordinal]="2">
        <bifi-app-table-layout
          [columns]="roomColumns"
          [data]="facility()?.rooms || []"
        ></bifi-app-table-layout>
      </bifi-app-form-section>
    } @else if (error()) {
      <p>Something went wrong... {{ error() }}</p>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
