<h1 class="text-2xl font-bold mb-4">{{ 'rooms' | translate: {} : 'asset-roster' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNewRoom' | translate: {} : 'asset-roster'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'rooms/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByNameCodeFacility' | translate: {} : 'asset-roster'"
  [searchFilters]="roomFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'asset-roster'"
  [columns]="roomColumns"
  [data]="rooms"
  [onClickRow]="goToEditRoom"
  clickRowPermission="rooms/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteRoom(row._id)"
      resource="rooms"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
