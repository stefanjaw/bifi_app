<h1 class="text-2xl font-bold mb-4">Rooms</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Room"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'rooms/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name, code, facility or address"
  [searchFilters]="roomFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="roomColumns"
  [data]="rooms"
  [onClickRow]="goToEditRoom"
  clickRowPermission="rooms/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteRoom(row._id)"
      resource="rooms"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
