<h1 class="text-2xl font-bold mb-4">Facilities</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Facility"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'facilities/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name or contact"
  [searchFilters]="facilityFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="facilityColumns"
  [data]="facilities"
  [onClickRow]="gotoEditFacility"
  clickRowPermission="facilities/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteFacility(element._id)"
      resource="facilities"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
