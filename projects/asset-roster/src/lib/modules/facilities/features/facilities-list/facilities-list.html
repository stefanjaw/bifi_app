<h1 class="text-2xl font-bold mb-4">Facilities</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Facility"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'facilities/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name or contact"
  [searchFilters]="facilityFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="facilityColumns" [data]="facilities" [onClickRow]="gotoEditFacility" clickRowPermission="facilities/update:view">
    <!-- <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      [routerLink]="['../edit/', row._id]"
      *bifiAppHasPermission="'facilities/update:view'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'facilities:delete:model'"
      severity="danger"
      label="Delete"
      (onClick)="deleteFacility(row._id)"
      icon="pi pi-trash"
    ></p-button> -->
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteFacility(element._id);"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
