<h1 class="text-2xl font-bold mb-4">{{ 'facilities' | translate: {} : 'asset-roster' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNewFacility' | translate: {} : 'asset-roster'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'facilities/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByNameContact' | translate: {} : 'asset-roster'"
  [searchFilters]="facilityFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'asset-roster'"
  [columns]="facilityColumns"
  [data]="facilities"
  [onClickRow]="gotoEditFacility"
  clickRowPermission="facilities/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteFacility(element._id)"
      resource="facilities"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
