<article
  [ngClass]="[
    state().className,
    assetRosterStatusManager.currentVariant() === this.variant() ? 'ring-4' : '',
    compact()
      ? 'p-2 rounded-lg shadow-lg transition-all duration-300 ease-in-out text-white cursor-pointer'
      : 'p-4 rounded-lg shadow-lg transition-all duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 text-white cursor-pointer',
  ]"
  (click)="assetRosterStatusManager.filter(this.variant())"
  (keyup)="assetRosterStatusManager.filter(this.variant())"
  tabindex="0"
>
  @if (compact()) {
    <div class="flex items-center justify-between gap-2">
      <span class="text-xs font-semibold leading-tight">
        {{ state().title | translate: {} : 'asset-roster' }}
      </span>
      <span class="text-sm font-bold">{{ units() }}</span>
      <i [ngClass]="[state().icon]" class="text-sm opacity-80"></i>
    </div>
  } @else {
    <header class="flex items-center justify-between">
      <h2 class="text-lg font-semibold">
        {{ state().title | translate: {} : 'asset-roster' }}
      </h2>
      <i [ngClass]="[state().icon]" [bifiAppIcon]="'lg'"></i>
    </header>

    <footer class="w-full flex flex-col justify-center items-center">
      <h3 class="text-xl font-bold">{{ units() }}</h3>
      <p class="font-semibold text-sm">{{ units() }} unit (s)</p>
    </footer>
  }
</article>
