<bifi-app-form-section title="Documents" id="documents" [ordinal]="2">
  <section class="flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <div></div>
      @if (isEditMode()) {
        <p-button label="Add Document" icon="pi pi-plus" (onClick)="handleAddDocument()" />
      }
    </div>

    @if (isEditMode()) {
      <div class="text-sm text-gray-500 italic">Click "Add Document" to upload.</div>
    } @else {
      <div class="text-sm text-gray-500 italic">No documents uploaded.</div>
    }

    <div class="flex flex-col gap-2 mt-4">
      @for (documentControl of attachmentsControl.controls; track $index) {
        @let document = documentControl.getRawValue();
        <div class="flex items-center justify-between gap-2 rounded border border-gray-200 p-2">
          <p>{{ document.file.name }}</p>

          <p-button
            label="View"
            severity="secondary"
            icon="pi pi-file"
            (onClick)="downloadFile(document)"
          ></p-button>
        </div>
      }
    </div>
              <div class="md:col-span-2">
            <bifi-app-form-field previewVariant="italic">
              <bifi-app-form-label>AI Assistant</bifi-app-form-label>
       <textarea
  pInputTextarea
  rows="4"
  placeholder="Ask any questions about the document..."
  class="w-full"
  [value]="question()"
  (ngModelChange)="question.set($any($event))"
></textarea>
              <bifi-app-form-error></bifi-app-form-error>
            </bifi-app-form-field>
          </div>
          <p-button label="Ask Gemini" severity="info" icon="pi pi-send" (click)="submitAskGenai()"></p-button>
  </section>
</bifi-app-form-section>
