<bifi-app-form-section title="Equipment Notes" id="notes" [ordinal]="2">


  <form [formGroup]="form" class="flex flex-col gap-4">

    <!-- Input area -->
    @if(isEditMode()) {

    <div class="flex flex-col gap-2">
      <bifi-app-form-field>
        <bifi-app-form-label>Add Note</bifi-app-form-label>
        <textarea pInputTextarea [(ngModel)]="remarkTextModel" [ngModelOptions]="{standalone:true}" rows="3"
          placeholder="Enter a note..." class="w-full"></textarea>
        <bifi-app-form-error></bifi-app-form-error>
      </bifi-app-form-field>

      <div class="flex justify-end">
        <p-button type="button" icon="pi pi-plus" label="Add Note" severity="secondary" (click)="addNote()"></p-button>
      </div>

    </div>
    }

    <!-- Notes list inside p-message -->
    <div formArrayName="remarks">
      @for (control of notesControl.controls; track $index) {
      <p-message severity="info" class="w-full mt-2 p-3">
        <div class="flex flex-col gap-2 w-full">

          <!-- Note content -->
          <span class="text-sm whitespace-pre-line">
            {{ control.value.remark }}
          </span>

          <!-- Metadata -->
          <div class="w-full flex justify-end">
            <span class="text-xs text-gray-500 text-right">
              Created by
              <span class="font-medium text-gray-700">
                {{ getUserName(control.value.createdBy) }}
              </span>,
              {{ control.value.performDate | date:'medium' }}
            </span>
          </div>

        </div>
      </p-message>
      }
    </div>
  </form>
</bifi-app-form-section>
