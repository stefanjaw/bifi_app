<form
  [formGroup]="formService.form"
  class="min-h-screen bg-gray-50"
  bifiAppFormActionsHandler
  (appSubmit)="handleSave()"
  [isPreviewMode]="!isEditMode()"
>
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <p-button icon="pi pi-chevron-left" [text]="true" severity="secondary" size="small" />
        <h1 class="text-xl font-semibold text-gray-900">Asset Details</h1>
        <p-button icon="pi pi-chevron-right" [text]="true" severity="secondary" size="small" />
      </div>

      <div class="flex items-center space-x-3">
        @if (isEditMode()) {
          <p-button label="Cancel" severity="secondary" (onClick)="handleCancel()" type="button" />
          <p-button
            [icon]="isSubmitLoading() ? 'pi pi-spinner' : undefined"
            [label]="isSubmitLoading() ? 'Saving...' : 'Save Changes'"
            icon="pi pi-check"
            severity="success"
            type="submit"
            *bifiAppHasPermission="'asset-rosters:update:model'"
          />
        } @else {
          <p-button
            [disabled]="isLoading()"
            label="Edit Details"
            icon="pi pi-pencil"
            (onClick)="toggleEdit()"
            type="button"
            *bifiAppHasPermission="'asset-rosters:update:model'"
          />
        }
        <p-button
          label="Back to Dashboard"
          icon="pi pi-arrow-left"
          severity="info"
          [outlined]="true"
          (onClick)="handleBackToDashboard()"
          type="button"
        />
      </div>
    </div>
  </div>

  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">
        <span class="p-tabheader-title">Info & Maintenance</span>
      </p-tab>
      <p-tab value="1">
        <span class="p-tabheader-title">Lifecycle & TCO</span>
      </p-tab>
    </p-tablist>

    <p-tabpanels>
      <!-- Form Content -->
      <div class="max-w-7xl mx-auto px-6 py-8">
        @if (!isLoading()) {
          <bifi-app-form-layout title="">
            <div class="flex flex-col gap-8">
              <p-tabpanel value="0">
                <!-- the general information of the assetRoster -->
                <bifi-app-general-information-section
                  [assetRoster]="assetRoster()"
                  [assetTypes]="assetTypes()"
                  [contacts]="contacts()"
                  [rooms]="rooms()"
                  [isEditMode]="isEditMode()"
                />

                <!-- the documents of the assetRoster -->
                <bifi-app-documents-section
                  [assetRoster]="assetRoster()"
                  [isEditMode]="isEditMode()"
                />

                <!-- the maintenance service of the assetRoster -->
                <bifi-app-maintenance-service-section
                  [assetRoster]="assetRoster()"
                  [maintenanceWindows]="maintenanceWindows()"
                  [isEditMode]="isEditMode()"
                />

                <!-- the commissioning and lifecycle of the assetRoster -->
                <bifi-app-commissioning-lifecycle-section
                  [assetRoster]="assetRoster()"
                  [isEditMode]="isEditMode()"
                />
                <!-- the activity history of the assetRoster -->
                <bifi-app-activity-history-section [activityHistory]="activityHistories()" />

                <!-- Notes Section -->
                <bifi-app-notes-section
                  [assetRoster]="assetRoster()"
                  [isEditMode]="isEditMode()"
                />
              </p-tabpanel>

              <p-tabpanel value="1">
                <bifi-app-asset-roster-financial-information
                  [assetRoster]="assetRoster()"
                  [assetTypes]="assetTypes()"
                  [isEditMode]="isEditMode()"
                />
              </p-tabpanel>
            </div>
          </bifi-app-form-layout>
        } @else {
          <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
        }
      </div>
    </p-tabpanels>
  </p-tabs>
</form>
