<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
  <bifi-app-form-section
    [title]="'commissioningAndLifecycle' | translate: {} : 'asset-roster'"
    id="commissioning-lifecycle"
    [ordinal]="4"
  >
    @let assetCommissioning = assetRoster()?.assetCommission;

    @if (!assetCommissioning || assetCommissioning.outcome === 'fail') {
      <p-button
        (onClick)="handleOpencommissionDialog()"
        [label]="
          !assetCommissioning
            ? ('commission' | translate: {} : 'asset-roster')
            : ('reAttemptCommission' | translate: {} : 'asset-roster')
        "
        [severity]="!assetCommissioning ? 'success' : 'warn'"
        class="w-full"
        size="small"
      />
    } @else {
      <p-button
        [label]="'decommission' | translate: {} : 'asset-roster'"
        severity="danger"
        class="w-full"
        (onClick)="handleOpenDecommissionDialog()"
        size="small"
      />
    }
  </bifi-app-form-section>
</div>
