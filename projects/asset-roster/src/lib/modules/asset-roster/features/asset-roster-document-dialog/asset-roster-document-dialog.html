<p-dialog
  [header]="'addNewDocument' | translate: {} : 'asset-roster'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6 min-h-96"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <bifi-app-form-field>
      <bifi-app-form-label>
        {{ 'documentDescriptor' | translate: {} : 'asset-roster' }}
      </bifi-app-form-label>
      <p-select
        appendTo="body"
        (onChange)="handleDescriptorChange($event.value)"
        [options]="descriptorOptions"
      ></p-select>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    @if (isOther()) {
      <bifi-app-form-field>
        <bifi-app-form-label>
          {{ 'descriptionForOther' | translate: {} : 'asset-roster' }}
        </bifi-app-form-label>
        <input
          pInputText
          formControlName="descriptor"
          type="text"
          [placeholder]="'egWarrantyCard' | translate: {} : 'asset-roster'"
        />
        <bifi-app-form-error></bifi-app-form-error>
      </bifi-app-form-field>
    }

    <bifi-app-form-uploader formArrayName="files">
      <p-fileUpload
        showUploadButton="false"
        showCancelButton="false"
        name="files"
        [multiple]="false"
        accept="application/*"
        maxFileSize="100000000"
        mode="basic"
      ></p-fileUpload>
    </bifi-app-form-uploader>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      [cancelLabel]="'cancel' | translate: {} : 'asset-roster'"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
