<form
  [formGroup]="formService.form"
  class="min-h-screen bg-gray-50"
  bifiAppFormActionsHandler
  (appSubmit)="handleSave()"
  [isPreviewMode]="!isEditMode()"
>
  <!-- Header -->
  <div class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <p-button icon="pi pi-chevron-left" [text]="true" severity="secondary" size="small" />
        <h1 class="text-xl font-semibold text-gray-900">Equipment Details</h1>
        <p-button icon="pi pi-chevron-right" [text]="true" severity="secondary" size="small" />
      </div>

      <div class="flex items-center space-x-3">
        @if (isEditMode()) {
          <p-button label="Cancel" severity="secondary" (onClick)="handleCancel()" type="button" />
          <p-button
            [icon]="isSubmitLoading() ? 'pi pi-spinner' : undefined"
            [label]="isSubmitLoading() ? 'Saving...' : 'Save Changes'"
            icon="pi pi-check"
            severity="success"
            type="submit"
            *bifiAppHasPermission="'products:update:model'"
          />
        } @else {
          <p-button
            [disabled]="isLoading()"
            label="Edit Details"
            icon="pi pi-pencil"
            (onClick)="toggleEdit()"
            type="button"
            *bifiAppHasPermission="'products:update:model'"
          />
        }
        <p-button
          label="Back to Dashboard"
          icon="pi pi-arrow-left"
          severity="info"
          [outlined]="true"
          (onClick)="handleBackToDashboard()"
          type="button"
        />
      </div>
    </div>
  </div>

  <!-- Form Content -->
  <div class="max-w-7xl mx-auto px-6 py-8">
    @if (!isLoading()) {
      <bifi-app-form-layout title="">
        <div class="flex flex-col gap-8">
          <!-- the general information of the product -->
          <bifi-app-general-information-section
            [product]="product()"
            [productTypes]="productTypes()"
            [contacts]="contacts()"
            [rooms]="rooms()"
            [isEditMode]="isEditMode()"
          />

          <!-- the documents of the product -->
          <bifi-app-documents-section [product]="product()" [isEditMode]="isEditMode()" />

          <!-- the maintenance service of the product -->
          <bifi-app-maintenance-service-section
            [product]="product()"
            [maintenanceWindows]="maintenaceWindows()"
            [isEditMode]="isEditMode()"
          />

          <!-- the commissioning and lifecycle of the product -->
          <bifi-app-commissioning-lifecycle-section
            [product]="product()"
            [isEditMode]="isEditMode()"
          />

          <!-- the activity history of the product -->
          <bifi-app-activity-history-section [activityHistory]="activityHistories()" />
        </div>
      </bifi-app-form-layout>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </div>
</form>
