@if (!isEditMode() && product()?.status !== 'decommissioned') {
  <bifi-app-form-section
    title="Commissioning & Lifecycle"
    id="commissioning-lifecycle"
    [ordinal]="4"
  >
    @let productCommissioning = product()?.productCommission;

    @if (!productCommissioning || productCommissioning.outcome === 'fail') {
      <p-button
        (onClick)="handleOpencommissionDialog()"
        [label]="!productCommissioning ? 'Commission' : 'Re-attempt Commission'"
        [severity]="!productCommissioning ? 'success' : 'warn'"
        class="w-full"
        size="small"
      />
    } @else {
      <p-button
        label="Decommission"
        severity="danger"
        class="w-full"
        (onClick)="handleOpenDecommissionDialog()"
        size="small"
      />
    }
  </bifi-app-form-section>
}
