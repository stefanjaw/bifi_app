<bifi-app-product-edit-form
  [product]="product()"
  [activityHistories]="activityHistories.value()"
  [productTypes]="productTypes.value()"
  [contacts]="contacts.value()"
  [rooms]="rooms.value()"
  [maintenaceWindows]="maintenaceWindows.value()"
  [isLoading]="loading()"
  [isSubmitLoading]="submitLoading()"
  [isEditMode]="isEditMode()"
/>

<!-- dialogs -->
<bifi-app-product-commissioning-form-dialog
  [product]="product()"
></bifi-app-product-commissioning-form-dialog>
<bifi-app-product-decommissioning-form-dialog
  [product]="product()"
></bifi-app-product-decommissioning-form-dialog>
<bifi-app-product-maintenance-form-dialog
  [product]="product()"
></bifi-app-product-maintenance-form-dialog>
<bifi-app-product-finish-maintenance-form-dialog
  [product]="product()"
  maintenanceType="service"
  #finishService
></bifi-app-product-finish-maintenance-form-dialog>
<bifi-app-product-finish-maintenance-form-dialog
  [product]="product()"
  maintenanceType="preventive-maintenance"
  #finishPM
></bifi-app-product-finish-maintenance-form-dialog>
<bifi-app-product-skip-maintenance-form-dialog
  [product]="product()"
></bifi-app-product-skip-maintenance-form-dialog>

<!-- Document upload -->
<bifi-app-product-document-dialog
  (submitted)="handleDocumentAdded($event)"
></bifi-app-product-document-dialog>
