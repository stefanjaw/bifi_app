<h1 class="text-2xl font-bold mb-4">{{ 'assetTypes' | translate: {} : 'asset-roster' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNewAssetType' | translate: {} : 'asset-roster'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'asset-types/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByNameDescription' | translate: {} : 'asset-roster'"
  [searchFilters]="assetTypeFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'asset-roster'"
  [columns]="assetTypeColumns"
  [data]="assetTypes"
  [onClickRow]="gotoEditAssetType"
  clickRowPermission="asset-types/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteAssetType(row._id)"
      resource="asset-types"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
