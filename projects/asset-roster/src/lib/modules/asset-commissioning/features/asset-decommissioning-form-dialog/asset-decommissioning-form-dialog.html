<p-dialog
  [header]="'decommissionAsset' | translate: {} : 'asset-roster'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <p [bifiAppText]="'small'">
      {{ 'decommissionConfirm' | translate: {} : 'asset-roster' }}
    </p>
    <p [bifiAppText]="'small'" class="font-bold!">
      {{ assetRoster()?.assetTypeIds?.[0]?.name || 'No type' }} -
      {{ assetRoster()?.productModel }} (S/N: {{ assetRoster()?.serialNumber }})
    </p>

    <bifi-app-form-field>
      <bifi-app-form-label>
        {{ 'reasonForDecommissioning' | translate: {} : 'asset-roster' }}
      </bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="details"
        type="text"
        [placeholder]="'enterDetails' | translate: {} : 'asset-roster'"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      [saveLabel]="'confirm' | translate: {} : 'asset-roster'"
      [cancelLabel]="'cancel' | translate: {} : 'asset-roster'"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
