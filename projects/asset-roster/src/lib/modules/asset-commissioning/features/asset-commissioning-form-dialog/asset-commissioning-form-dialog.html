<p-dialog
  [header]="
    (assetRoster()?.assetCommission ? 'reattemptCommission' : 'commission')
      | translate: {} : 'asset-roster'
  "
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <p [bifiAppText]="'small'">
      {{ 'performInspectionFor' | translate: {} : 'asset-roster' }}
      {{ assetRoster()?.productModel + ' - ' + assetRoster()?.serialNumber }}
    </p>

    <bifi-app-form-field>
      <bifi-app-form-label>
        {{ 'inspectionOutcome' | translate: {} : 'asset-roster' }}
      </bifi-app-form-label>
      <div class="flex flex-wrap gap-4">
        <div class="flex items-center">
          <p-radiobutton value="pass" formControlName="outcome" inputId="pass" />
          <label for="pass" [bifiAppText]="'small'" class="ml-2 text-green-600">
            {{ 'pass' | translate: {} : 'asset-roster' }}
          </label>
        </div>

        <div class="flex items-center">
          <p-radiobutton value="fail" formControlName="outcome" inputId="fail" />
          <label for="fail" [bifiAppText]="'small'" class="ml-2 text-red-600">
            {{ 'fail' | translate: {} : 'asset-roster' }}
          </label>
        </div>
      </div>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-field>
      <bifi-app-form-label>{{ 'details' | translate: {} : 'asset-roster' }}</bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="details"
        type="text"
        [placeholder]="'enterDetails' | translate: {} : 'asset-roster'"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <!-- <bifi-app-form-field>
      <bifi-app-form-label>Upload Inspection Report (PDF Optional)</bifi-app-form-label>
      <input type="file" formControlName="attachments" pInputText />
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field> -->

    <bifi-app-form-uploader formArrayName="attachments">
      <p-fileUpload
        showUploadButton="false"
        showCancelButton="false"
        name="files"
        [multiple]="false"
        accept="application/*"
        maxFileSize="100000000"
        mode="basic"
      ></p-fileUpload>
    </bifi-app-form-uploader>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      [cancelLabel]="'cancel' | translate: {} : 'asset-roster'"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
