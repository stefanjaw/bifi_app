<header class="shrink-0 flex items-center justify-between pb-4 border-b border-gray-200">
  <div>
    <h1 class="text-2xl font-bold text-gray-800">Helpdesk Tickets</h1>
  </div>
  <div class="flex items-center space-x-2">
    <p-button
      label="New Ticket"
      severity="secondary"
      icon="pi pi-plus"
      [routerLink]="['../create']"
      *bifiAppHasPermission="'tickets/create:view'"
    ></p-button>

    <div class="flex items-center space-x-3">
      <span class="text-sm font-medium text-gray-600">View:</span>

      <div class="flex items-center rounded-md bg-gray-200 p-0.5">
        <button
          (click)="viewState.set('list')"
          [class]="viewState() === 'list' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-600'"
          class="flex items-center gap-1 px-3 py-1 text-sm font-semibold rounded transition-colors duration-200"
        >
          <i class="pi pi-list text-xs"></i>
          List
        </button>
        <button
          (click)="viewState.set('calendar')"
          [class]="
            viewState() === 'calendar' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-600'
          "
          class="flex items-center gap-1 px-3 py-1 text-sm font-semibold rounded transition-colors duration-200"
        >
          <i class="pi pi-th-large text-xs"></i>
          Calendar
        </button>
      </div>
    </div>
  </div>
</header>

<bifi-app-search-bar
  label="Search by subject, type, priority, stage, category, module or assigned user"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-filter-bar [filterFields]="filterFields"></bifi-app-filter-bar>

@if (isLoading()) {
  <div class="grow flex items-center justify-center">
    <div class="text-center">
      <i class="pi pi-spinner pi-spin"></i>
      <p class="mt-2 text-gray-600">Loading Tickets Data...</p>
    </div>
  </div>
} @else if (error()) {
  <div class="grow flex items-center justify-center">
    <div
      class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-md relative"
      role="alert"
    >
      <strong class="font-bold">Error:</strong>
      <span class="block sm:inline">{{ error() }}</span>
    </div>
  </div>
} @else {
  @if (viewState() === 'list') {
    <bifi-app-table-layout
      [columns]="columns"
      [data]="tickets"
      [infiniteScroll]="true"
      [onClickRow]="gotoEditTicket"
      clickRowPermission="tickets/update:view"
    >
      <ng-template #actions let-element>
        <bifi-app-buttons-actions
          (deleteClicked)="deleteTicket(element._id)"
          resource="tickets"
        ></bifi-app-buttons-actions>
      </ng-template>
    </bifi-app-table-layout>
  } @else if (viewState() === 'calendar') {
    <bifi-app-calendar-view
      [events]="calendarEvents()"
      (eventDateChange)="onTicketDateChange($event)"
    ></bifi-app-calendar-view>
  }
}
