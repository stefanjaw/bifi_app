<header class="shrink-0 flex items-center justify-between pb-4 border-b border-gray-200">
  <div>
    <h1 class="text-2xl font-bold text-gray-800">
      {{ 'tickets.title' | translate: {} : 'helpdesk' }}
    </h1>
  </div>
  <div class="flex items-center space-x-2">
    <p-button
      [label]="'tickets.addNew' | translate: {} : 'helpdesk'"
      severity="secondary"
      icon="pi pi-plus"
      [routerLink]="['../create']"
      *bifiAppHasPermission="'tickets/create:view'"
    ></p-button>

    <div class="flex items-center space-x-3">
      <span class="text-sm font-medium text-gray-600">
        {{ 'tickets.view' | translate: {} : 'helpdesk' }}
      </span>

      <div class="flex items-center rounded-md bg-gray-200 p-0.5">
        <button
          (click)="viewState.set('list')"
          [class]="viewState() === 'list' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-600'"
          class="flex items-center gap-1 px-3 py-1 text-sm font-semibold rounded transition-colors duration-200"
        >
          <i class="pi pi-list text-xs"></i>
          {{ 'tickets.list' | translate: {} : 'helpdesk' }}
        </button>
        <button
          (click)="viewState.set('calendar')"
          [class]="
            viewState() === 'calendar' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-600'
          "
          class="flex items-center gap-1 px-3 py-1 text-sm font-semibold rounded transition-colors duration-200"
        >
          <i class="pi pi-th-large text-xs"></i>
          {{ 'tickets.calendar' | translate: {} : 'helpdesk' }}
        </button>
      </div>
    </div>
  </div>
</header>

<bifi-app-search-bar
  [label]="'tickets.searchPlaceholder' | translate: {} : 'helpdesk'"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-filter-bar [filterFields]="filterFields" [scope]="'helpdesk'"></bifi-app-filter-bar>

@if (viewState() === 'list') {
  <bifi-app-table-layout
    [columns]="columns"
    [data]="tickets"
    [infiniteScroll]="true"
    [onClickRow]="gotoEditTicket"
    clickRowPermission="tickets/update:view"
    [scope]="'helpdesk'"
  >
    <ng-template #actions let-element>
      <p-button
        size="small"
        variant="text"
        severity="info"
        icon="pi pi-plus"
        [pTooltip]="'tickets.createTask' | translate: {} : 'helpdesk'"
        (onClick)="$event.stopPropagation(); createTask(element)"
      ></p-button>
      <bifi-app-buttons-actions
        (deleteClicked)="deleteTicket(element._id)"
        resource="tickets"
      ></bifi-app-buttons-actions>
    </ng-template>
  </bifi-app-table-layout>
} @else if (viewState() === 'calendar') {
  <bifi-app-calendar-view
    [events]="calendarEvents()"
    (eventDateChange)="onTicketDateChange($event)"
  ></bifi-app-calendar-view>
}

<bifi-app-create-tasks-form-dialog #createTasksFormDialog></bifi-app-create-tasks-form-dialog>
