<bifi-app-form-layout
  [title]="
    isUpdate()
      ? ('form.editList' | translate: {} : 'email-marketing')
      : ('form.createList' | translate: {} : 'email-marketing')
  "
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section
        [title]="'form.section.listInformation' | translate: {} : 'email-marketing'"
        id="list-info"
        [ordinal]="1"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'form.label.campaignName' | translate: {} : 'email-marketing' }}
            </bifi-app-form-label>
            <input
              pInputText
              formControlName="name"
              type="text"
              [placeholder]="'form.placeholder.listName' | translate: {} : 'email-marketing'"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'description' | translate: {} : 'email-marketing' }}
            </bifi-app-form-label>
            <textarea
              pInputTextarea
              formControlName="description"
              [placeholder]="'form.placeholder.description' | translate: {} : 'email-marketing'"
              rows="3"
            ></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
