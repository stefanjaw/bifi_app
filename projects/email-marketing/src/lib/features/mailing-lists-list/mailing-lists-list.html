<p-button
  [label]="'buttons.dashboard' | translate: {} : 'email-marketing'"
  severity="secondary"
  variant="text"
  icon="pi pi-arrow-left"
  [routerLink]="['../dashboard']"
  class="mb-1"
></p-button>

<h1 class="text-2xl font-bold mb-4">
  {{ 'pageTitle.mailingLists' | translate: {} : 'email-marketing' }}
</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'buttons.newList' | translate: {} : 'email-marketing'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['create']"
    *bifiAppHasPermission="'mailing-lists/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'search.byName' | translate: {} : 'email-marketing'"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [scope]="'email-marketing'"
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="lists"
  [onClickRow]="goToEdit"
  clickRowPermission="mailing-lists/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteList(row._id)"
      resource="mailing-lists"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
