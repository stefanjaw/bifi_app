<p-button
  label="Dashboard"
  severity="secondary"
  variant="text"
  icon="pi pi-arrow-left"
  [routerLink]="['../dashboard']"
  class="mb-1"
></p-button>

<h1 class="text-2xl font-bold mb-4">Subscribers</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Subscriber"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['create']"
    *bifiAppHasPermission="'subscribers/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar label="Search by email" [searchFilters]="filters"></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="subscribers"
  [onClickRow]="goToEdit"
  clickRowPermission="subscribers/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteSubscriber(row._id)"
      resource="subscribers"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
