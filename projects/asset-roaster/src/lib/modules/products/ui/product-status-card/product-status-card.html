<article
  [ngClass]="[
    state().className,
    productStatusManager.currentVariant() === this.variant() ? 'ring-4' : '',
    'p-4 rounded-lg shadow-lg transition-all duration-200 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2  text-white',
  ]"
  (click)="productStatusManager.filter(this.variant())"
  (keyup)="productStatusManager.filter(this.variant())"
  tabindex="0"
>
  <header class="flex items-center justify-between">
    <h2 class="text-lg font-semibold">
      {{ state().title }}
    </h2>
    <mat-icon>{{ state().icon }}</mat-icon>
  </header>

  <footer class="w-full flex flex-col justify-center items-center">
    <h3 class="text-xl font-bold">{{ units() }}</h3>
    <p class="font-semibold text-sm">{{ units() }} unit (s)</p>
  </footer>
</article>
