@if (!isEditMode() && product()?.status !== 'decomissioned') {
  <bifi-app-form-section
    title="Commissioning & Lifecycle"
    id="commissioning-lifecycle"
    [ordinal]="4"
  >
    @let productComissioning = product()?.productComission;

    @if (!productComissioning || productComissioning.outcome === 'fail') {
      <p-button
        (onClick)="handleOpenComissionDialog()"
        [label]="!productComissioning ? 'Commission' : 'Re-attempt Comission'"
        [severity]="!productComissioning ? 'success' : 'warn'"
        class="w-full"
        size="small"
      />
    } @else {
      <p-button
        label="Decomission"
        severity="danger"
        class="w-full"
        (onClick)="handleOpenDecomissionDialog()"
        size="small"
      />
    }
  </bifi-app-form-section>
}
