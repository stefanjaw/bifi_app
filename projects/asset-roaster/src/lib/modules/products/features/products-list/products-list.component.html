<section class="flex justify-between items-center gap-2 mb-4">
  <h1 class="text-2xl font-bold">Equipment Dashboard</h1>
  <div class="flex gap-2">
    <p-button label="Import CSV" severity="success" icon="pi pi-upload"></p-button>
    <p-button label="Export CSV" icon="pi pi-download"></p-button>
    <p-button label="Add New Equipment" severity="secondary"></p-button>
  </div>
</section>

<section class="flex flex-row gap-2 w-full mb-4">
  <bifi-app-product-status-card
    [units]="0"
    variant="under-service"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="overdue"
    class="w-full"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="due"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="in-pm"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="pm-not-set"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>
</section>

<bifi-app-search-bar
  [searchFilters]="productFilters"
  label="Search by Model, S/N or condition"
></bifi-app-search-bar>

<!-- table -->
<bifi-app-table-layout [columns]="productColumns" [data]="products">
  <ng-template #actions let-element>
    <bifi-app-badge
      routerLink="/asset-roaster/equipment/maintenance/{{ element._id }}"
      class="cursor-pointer"
      variant="warning"
      text="View details"
    ></bifi-app-badge>
  </ng-template>
</bifi-app-table-layout>
