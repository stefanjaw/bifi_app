<h1 class="text-2xl font-bold mb-4">Equipment Dashboard</h1>

<section class="flex flex-row gap-2 w-full mb-4">
  <bifi-app-product-status-card
    [units]="0"
    variant="under-service"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="overdue"
    class="w-full"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="due"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="in-pm"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="0"
    variant="pm-not-set"
    class="w-full"
    (filter)="filterByCard($event)"
  ></bifi-app-product-status-card>
</section>

<bifi-app-search-bar
  [searchFilters]="productFilters"
  label="Search by Model, S/N or condition"
></bifi-app-search-bar>

<!-- table -->
<bifi-app-table-layout [columns]="productColumns" [data]="products">
  <ng-template #actions>
    <button mat-menu-item><mat-icon>edit</mat-icon>Edit</button>
  </ng-template>
</bifi-app-table-layout>
