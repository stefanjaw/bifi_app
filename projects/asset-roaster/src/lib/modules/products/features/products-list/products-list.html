<section class="flex justify-between items-center gap-2 mb-4">
  <h1 class="text-2xl font-bold">Equipment Dashboard</h1>
  <div class="flex gap-2">
    <p-button label="Import CSV" severity="success" icon="pi pi-upload"></p-button>
    <p-button label="Export CSV" icon="pi pi-download" (onClick)="exportCSV()"></p-button>
    <p-button
      label="Add New Equipment"
      severity="secondary"
      icon="pi pi-plus"
      (onClick)="createDialog.openDialog()"
    ></p-button>

    <span *bifiAppHasPermission="'product:read'">Test!! you can read</span>
  </div>
</section>

<section class="flex flex-col lg:flex-row gap-4 mb-4">
  <bifi-app-product-status-card
    [units]="productsUnderServiceCount.value() || 0"
    variant="under-service"
    class="w-full"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="productsOverdueCount.value() || 0"
    variant="overdue"
    class="w-full"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="productsDueCount.value() || 0"
    variant="due"
    class="w-full"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="productsInPMCount.value() || 0"
    variant="in-pm"
    class="w-full"
  ></bifi-app-product-status-card>

  <bifi-app-product-status-card
    [units]="productsPMNotSetCount.value() || 0"
    variant="pm-not-set"
    class="w-full"
  ></bifi-app-product-status-card>
</section>

<section class="flex flex-col md:flex-row gap-2 mb-4">
  <bifi-app-search-bar
    [searchFilters]="productFilters"
    label="Search by Model, S/N or condition"
    class="md:w-7/10"
  ></bifi-app-search-bar>
  <bifi-app-product-status-select class="md:w-3/10"></bifi-app-product-status-select>
</section>

<!-- table -->
<bifi-app-table-layout [columns]="productColumns" [data]="products">
  <ng-template #actions let-element>
    <bifi-app-badge
      routerLink="/asset-roaster/equipment/maintenance/{{ element._id }}"
      class="cursor-pointer"
      variant="warning"
      text="View details"
    ></bifi-app-badge>
  </ng-template>
</bifi-app-table-layout>

<bifi-app-product-form-dialog #createDialog></bifi-app-product-form-dialog>
