<bifi-app-product-edit-form
  [product]="product()"

  [contacts]="contacts.value()"
  [rooms]="rooms.value()"
  [maintenaceWindows]="maintenaceWindows.value()"
  [isLoading]="loading()"
  [isSubmitLoading]="submitLoading()"
  [isEditMode]="isEditMode()"
/>

></bifi-app-product-comissioning-form-dialog>

  [product]="product()"
></bifi-app-product-decomissioning-form-dialog>
<bifi-app-product-maintenance-form-dialog
  [product]="product()"
></bifi-app-product-maintenance-form-dialog>
<bifi-app-product-finish-maintenance-form-dialog
  [product]="product()"

  #finishServiceDialog
></bifi-app-product-finish-maintenance-form-dialog>
<bifi-app-product-finish-maintenance-form-dialog
  [product]="product()"

></bifi-app-product-finish-maintenance-form-dialog>
