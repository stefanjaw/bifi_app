<p-dialog
  header="Decommission Equipment"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <p [bifiAppText]="'small'">
      Are you sure you want to decommission this equipment? This action cannot be easily undone.
    </p>
    <p [bifiAppText]="'small'" class="font-bold!">
      {{ product()?.productTypeIds?.[0]?.name || 'No type' }} - {{ product()?.productModel }} (S/N:
      {{ product()?.serialNumber }})
    </p>

    <bifi-app-form-field>
      <bifi-app-form-label>Reason for Decommissioning</bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="details"
        type="text"
        placeholder="Enter details"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-actions
      [isSubmitting]="submitLoading()"
      (cancelClicked)="closeDialog()"
      saveLabel="Confirm"
      cancelLabel="Cancel"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
