<h1 class="text-2xl font-bold mb-4">Equipment Dashboard</h1>

<section class="flex flex-row gap-2 w-full mb-4">
  <bifi-app-equipment-status-card
    [units]="0"
    variant="under-service"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="overdue"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="due"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="in-pm"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="pm-not-set"
    class="w-full"
  ></bifi-app-equipment-status-card>
</section>

<bifi-app-search-bar
  [searchFilters]="equipmentFilters"
  label="Search by Model, S/N or condition"
></bifi-app-search-bar>

<!-- table -->
<bifi-app-table-layout
  [columns]="columns()"
  [data]="products"
  (page)="changePage($event)"
>
  <ng-template #actions>
    <button mat-menu-item><mat-icon>edit</mat-icon>Edit</button>
    <button mat-menu-item><mat-icon>delete</mat-icon>Delete</button>
  </ng-template>
</bifi-app-table-layout>
