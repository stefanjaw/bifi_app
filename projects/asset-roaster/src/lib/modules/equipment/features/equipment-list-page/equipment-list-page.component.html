<h1 class="text-2xl font-bold mb-4">Equipment Dashboard</h1>

<section class="flex flex-row gap-2 w-full mb-4">
  <bifi-app-equipment-status-card
    [units]="0"
    variant="under-service"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="overdue"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="due"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="in-pm"
    class="w-full"
  ></bifi-app-equipment-status-card>

  <bifi-app-equipment-status-card
    [units]="0"
    variant="pm-not-set"
    class="w-full"
  ></bifi-app-equipment-status-card>
</section>

<bifi-app-search-bar [searchFilters]="equipmentFilters"></bifi-app-search-bar>

@if (products.isLoading()) {
  <mat-progress-spinner [diameter]="50"></mat-progress-spinner>
} @else if (products.error()) {
  <bifi-app-message-card
    title="Ups, something went wrong"
    subtitle="try again!"
    icon="error"
  ></bifi-app-message-card>
} @else if (products.hasValue() && products.value().docs.length > 0) {
  <bifi-app-table-layout
    [columns]="columns()"
    [data]="products.value()"
    (page)="changePage($event)"
  >
    <ng-template #actions>
      <button mat-menu-item><mat-icon>edit</mat-icon>Edit</button>
      <button mat-menu-item><mat-icon>delete</mat-icon>Delete</button>
    </ng-template>
  </bifi-app-table-layout>
} @else {
  <bifi-app-message-card
    title="No Equipment Found"
    subtitle="No equipment items match your current search term or filter selection."
    icon="search"
  ></bifi-app-message-card>
}
