<h1 class="text-2xl font-bold mb-4">Maintenance Windows</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Mintenance Window"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'maintenance-windows:create'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name and recurrency"
  [searchFilters]="maintenanceWindowFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="maintenanceWindowColumns" [data]="maintenanceWindows">
  <ng-template #actions let-row>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      [routerLink]="['../edit/', row._id]"
      *bifiAppHasPermission="'maintenance-windows:update'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'maintenance-windows:delete'"
      severity="danger"
      label="Delete"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
