]
<bifi-app-form-layout
  title="{{ isUpdate() ? 'Update' : 'Create' }} Room"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section title="General information" id="general-info" [ordinal]="1">
        <section class="grid gap-3 sm:grid-cols-2 w-full">
          <bifi-app-form-field class="mb-3">
            <bifi-app-form-label>Name</bifi-app-form-label>
            <input pInputText formControlName="name" type="text" placeholder="Name" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="mb-3">
            <bifi-app-form-label>Code</bifi-app-form-label>
            <input pInputText formControlName="code" type="text" placeholder="Code" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="mb-3">
            <bifi-app-form-label>Address</bifi-app-form-label>
            <input pInputText formControlName="address" type="text" placeholder="Code" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Facility</bifi-app-form-label>
            <p-select
              formControlName="facilityId"
              [options]="facilities()"
              optionLabel="name"
              optionValue="_id"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </section>
      </bifi-app-form-section>
    } @else if (error()) {
      <p>Something went wrong... {{ error() }}</p>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
