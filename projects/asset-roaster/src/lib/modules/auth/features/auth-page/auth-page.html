@if (currentSuccessMessage) {
  <!-- Success Message -->
  <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 max-w-md w-full mx-4">
    <div class="p-4 bg-green-50 border border-green-200 rounded-md shadow-lg">
      <p class="text-green-600 text-sm">{{ currentSuccessMessage }}</p>
    </div>
  </div>
}

<!-- Auth Form -->
<bifi-app-auth-form
  [formData]="formData()"
  [socialProviders]="socialProviders()"
  (handleSubmit)="handleSubmit($event)"
  (handleSocialLogin)="handleSocialLogin($event)"
  (handleToggleMode)="handleToggleMode()"
></bifi-app-auth-form>
