<div
  class="bg-white rounded-lg shadow-md p-4 cursor-grab hover:shadow-lg hover:border-blue-500 border-l-4 border-transparent transition-all duration-200 active:cursor-grabbing"
>
  <div class="flex justify-between items-start">
    <div>
      <h3 class="font-semibold text-gray-800">{{ lead().name }}</h3>
      <p class="text-sm text-gray-500">{{ lead().company }}</p>
    </div>
    @if (contact()) {
      <img
        [ngSrc]="contact()!.avatarUrl"
        [alt]="contact()!.name"
        width="32"
        height="32"
        class="rounded-full"
      />
    } @else {
      <div
        class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 font-semibold text-sm"
      >
        ?
      </div>
    }
  </div>
</div>
