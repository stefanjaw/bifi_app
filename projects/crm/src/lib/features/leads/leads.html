<div class="flex flex-col h-full bg-gray-50 overflow-hidden">
  <header class="bg-white shadow-sm p-4 z-10">
    <h1 class="text-2xl font-bold text-gray-800">Leads Dashboard</h1>
  </header>

  <main class="flex-grow p-4 overflow-x-auto">
    <div class="flex space-x-4 min-w-max h-full">
      @for (stage of stages(); track stage) {
        <div
          class="flex-shrink-0 w-80 bg-gray-100 rounded-lg shadow-inner transition-colors duration-200"
          (dragover)="onDragOver($event, stage)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event, stage)"
          [class.bg-blue-100]="draggedOverStage() === stage"
        >
          <div class="p-4 border-b border-gray-200">
            <h2 class="text-lg font-semibold text-gray-700">
              {{ stage }} ({{ leadsByStage()[stage].length }})
            </h2>
          </div>
          <div class="p-2 space-y-2 h-[calc(100%-4rem)] overflow-y-auto">
            @for (lead of leadsByStage()[stage]; track lead.id) {
              <bifi-app-lead-card
                [lead]="lead"
                [contact]="getContactForLead(lead)"
                (click)="onSelectLead(lead)"
                draggable="true"
                (dragstart)="onDragStart($event, lead)"
                (dragend)="onDragEnd()"
                [class.opacity-50]="draggedLeadId() === lead.id"
                [class.cursor-grabbing]="draggedLeadId() === lead.id"
              />
            } @empty {
              <div class="text-center p-4 text-gray-500">No leads in this stage.</div>
            }
          </div>
        </div>
      }
    </div>
  </main>
</div>

@if (selectedLead()) {
  <bifi-app-lead-detail-modal
    [lead]="selectedLead()!"
    [stages]="stages()"
    [contacts]="contacts()"
    (closed)="onCloseModal()"
    (save)="onSaveLead($event)"
  />
}
