<bifi-app-form-layout
  [title]="isUpdate() ? 'Update CRM Entry' : 'Create CRM Entry'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Deal Information" id="crm-deal-info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Title</bifi-app-form-label>
            <input pInputText formControlName="title" type="text" placeholder="e.g. Enterprise License Deal" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Stage</bifi-app-form-label>
            <p-select
              formControlName="stage"
              [options]="stageOptions()"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select stage"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Amount</bifi-app-form-label>
            <p-inputnumber formControlName="amount" [min]="0" mode="decimal" placeholder="0.00" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Currency</bifi-app-form-label>
            <input pInputText formControlName="currency" type="text" placeholder="USD" maxlength="3" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Probability (%)</bifi-app-form-label>
            <p-inputnumber formControlName="probability" [min]="0" [max]="100" placeholder="10" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Expected Close Date</bifi-app-form-label>
            <input pInputText formControlName="expectedCloseDate" type="date" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Tags (comma-separated)</bifi-app-form-label>
            <input pInputText formControlName="tagsInput" type="text" placeholder="e.g. enterprise, high-priority, renewal" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>

      <bifi-app-form-section title="Associations" id="crm-associations" [ordinal]="2">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Contact</bifi-app-form-label>
            <p-select
              formControlName="contact"
              [options]="contactOptions()"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select a contact"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Company</bifi-app-form-label>
            <p-select
              formControlName="company"
              [options]="companyOptions()"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select a company"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Owner</bifi-app-form-label>
            <p-select
              formControlName="owner"
              [options]="userOptions()"
              optionLabel="username"
              optionValue="_id"
              placeholder="Select an owner"
              [filter]="true"
              [showClear]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Salesperson</bifi-app-form-label>
            <p-select
              formControlName="salesperson"
              [options]="userOptions()"
              optionLabel="username"
              optionValue="_id"
              placeholder="Select a salesperson"
              [filter]="true"
              [showClear]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>

      <bifi-app-form-section title="Notes" id="crm-notes" [ordinal]="3">
        <div class="grid grid-cols-1 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Description</bifi-app-form-label>
            <textarea pTextarea formControlName="description" rows="3" placeholder="Enter a description..."></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Notes</bifi-app-form-label>
            <textarea pTextarea formControlName="notes" rows="4" placeholder="Internal notes..."></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
