<h1 class="text-2xl font-bold mb-4">CRM Leads</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Entry"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'crm/create:view'"
  ></p-button>

  <p-button
    label="Deals Board"
    severity="info"
    icon="pi pi-th-large"
    [routerLink]="['../deals']"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by title, company, contact or stage"
  [searchFilters]="crmFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="crmColumns" [data]="entries">
  <ng-template #actions let-element>
    <p-button
      *bifiAppHasPermission="'crm/update:view'"
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      routerLink="../edit/{{ element._id }}"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'crm:delete:model'"
      severity="danger"
      label="Delete"
      icon="pi pi-trash"
      (onClick)="deleteEntry(element._id)"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
