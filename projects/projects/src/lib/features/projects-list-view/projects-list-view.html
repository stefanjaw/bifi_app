<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<div class="flex-grow overflow-y-auto pt-4 pr-4">
  <div
    class="sticky top-0 bg-gray-50 z-10 grid grid-cols-14 h-12 items-center border-y border-gray-200 font-semibold text-gray-700 text-sm px-2"
  >
    <div class="col-span-4">Project Name</div>
    <div class="col-span-2">Contact</div>
    <div class="col-span-2">Start Date</div>
    <div class="col-span-2">End Date</div>
    <div class="col-span-1">Stage</div>
    <div class="col-span-1">Priority</div>
    <div class="col-span-2 text-center">Actions</div>
  </div>
  <div class="border-x border-b border-gray-200">
    <bifi-app-tree-list
      [items]="projects()"
      [enableDragDrop]="false"
      rowClass="group grid grid-cols-14 items-center border-b border-gray-200 h-10 text-sm text-gray-700 hover:bg-indigo-50 cursor-pointer"
      nameColClass="col-span-4 truncate flex items-center px-2"
      [levelIndentBase]="8"
      [showExpandPlaceholder]="true"
      (expandToggle)="expandToggle.emit($event)"
      (itemClick)="editProject.emit($event)"
      (itemReorder)="itemReorder.emit($event)"
      (itemReparent)="itemReparent.emit($event)"
    >
      <ng-template #rowActions let-project>
        <div class="col-span-2 px-2">
          {{ project.contactName ?? '—' }}
        </div>
        <div class="col-span-2 px-2">
          {{ project.start | date: 'MMM d, yyyy' }}
        </div>
        <div class="col-span-2 px-2">
          {{ project.end | date: 'MMM d, yyyy' }}
        </div>
        <div class="col-span-1 px-2 truncate">
          {{ project.stage?.name ?? '—' }}
        </div>
        <div class="col-span-1 px-2">
          {{ formatPriority(project.priority) }}
        </div>
        <div class="col-span-2 flex items-center justify-center gap-1">
          <p-button
            *bifiAppHasPermission="'tasks/view:view'"
            icon="pi pi-list-check"
            severity="secondary"
            size="small"
            [text]="true"
            pTooltip="View Tasks"
            tooltipPosition="top"
            (onClick)="viewTasks.emit(project.id); $event.stopPropagation()"
          ></p-button>
          <bifi-app-buttons-actions
            resource="projects"
            (deleteClicked)="deleteProject.emit(project.id)"
          ></bifi-app-buttons-actions>
        </div>
      </ng-template>
    </bifi-app-tree-list>
  </div>
</div>
