<bifi-app-form-layout
  title="{{ isUpdate() ? 'Edit Project' : 'New Project' }}"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
      *bifiAppHasPermission="isUpdate() ? 'projects:update:model' : 'projects:create:model'"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Project Information" id="project-info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input
              pInputText
              formControlName="name"
              type="text"
              placeholder="Project name"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Description</bifi-app-form-label>
            <textarea
              pInputTextarea
              formControlName="description"
              rows="4"
              placeholder="Project description"
            ></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Stage</bifi-app-form-label>
            <p-select
              formControlName="stage"
              [options]="stages()"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select a stage"
              [showClear]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Active</bifi-app-form-label>
            <p-checkbox formControlName="active" [binary]="true"></p-checkbox>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else {
      <p>Loading...</p>
    }
  </form>
</bifi-app-form-layout>
