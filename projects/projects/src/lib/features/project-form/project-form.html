<bifi-app-form-layout
  title="{{ isUpdate() ? 'Edit Project' : 'New Project' }}"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
      *bifiAppHasPermission="isUpdate() ? 'projects:update:model' : 'projects:create:model'"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Project Information" id="project-info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input pInputText formControlName="name" type="text" placeholder="Project name" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Description</bifi-app-form-label>
            <textarea
              pInputTextarea
              formControlName="description"
              rows="4"
              placeholder="Project description"
            ></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Stage *</bifi-app-form-label>
            <p-select
              formControlName="stage"
              [options]="stages()"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select a stage"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Priority *</bifi-app-form-label>
            <p-select
              formControlName="priority"
              [options]="priorityOptions"
              placeholder="Select priority"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Start Date *</bifi-app-form-label>
            <p-datepicker
              appendTo="body"
              formControlName="dateStart"
              [showIcon]="true"
              [showTime]="true"
              [fluid]="true"
            ></p-datepicker>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>End Date *</bifi-app-form-label>
            <p-datepicker
              appendTo="body"
              formControlName="dateEnd"
              [showIcon]="true"
              [showTime]="true"
              [fluid]="true"
            ></p-datepicker>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Contact</bifi-app-form-label>
            <p-select
              formControlName="contactId"
              [options]="contacts()"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select a contact"
              [showClear]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Sequence *</bifi-app-form-label>
            <input
              pInputText
              formControlName="sequence"
              type="number"
              placeholder="Project sequence"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Active</bifi-app-form-label>
            <p-checkbox formControlName="active" [binary]="true"></p-checkbox>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else {
      <p>Loading...</p>
    }
  </form>
</bifi-app-form-layout>
