<h1 class="text-2xl font-bold mb-4">Project Stages</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Stage"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'project-stages/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar label="Search by name" [searchFilters]="filters"></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="stages"
  [onClickRow]="gotoEditProjectStage"
  clickRowPermission="project-stages/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteStage(row._id)"
      resource="project-stages"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
