<p-dialog
  [header]="'selectContact.title' | translate: {} : 'clinical'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md"
>
  <bifi-app-form-field class="mb-8 min-h-40">
    <bifi-app-form-label>
      {{ 'selectContact.contact' | translate: {} : 'clinical' }}
    </bifi-app-form-label>
    <p-select
      appendTo="body"
      [formControl]="contactControl"
      [options]="contacts()"
      optionLabel="displayName"
      optionValue="_id"
      [filter]="true"
    ></p-select>
    <bifi-app-form-error></bifi-app-form-error>
  </bifi-app-form-field>

  <bifi-app-form-actions
    [isSubmitting]="false"
    [formDisabled]="!contactControl.valid || !contactControl.value"
    (submitClicked)="handleSubmit()"
    (cancelClicked)="closeDialog()"
    [cancelLabel]="'selectContact.cancel' | translate: {} : 'clinical'"
    [formChanged]="true"
  ></bifi-app-form-actions>
</p-dialog>
