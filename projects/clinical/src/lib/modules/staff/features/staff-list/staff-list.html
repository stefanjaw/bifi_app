<div class="flex gap-2 mb-4">
  <p-button
    label="Add New"
    severity="secondary"
    icon="pi pi-plus"
    (onClick)="addNew()"
    *bifiAppHasPermission="'staff/create:view'"
  ></p-button>
</div>
<bifi-app-search-bar label="Search..." [searchFilters]="filters"></bifi-app-search-bar>
<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="data"
  [onClickRow]="gotoEdit"
  clickRowPermission="staff/update:view"
  [scope]="'clinical'"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(row._id)"
      resource="staff"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>

<bifi-app-select-contact-dialog
  (selected)="onContactSelected($event)"
></bifi-app-select-contact-dialog>

<bifi-app-staff-form-dialog (saved)="onFormSaved()"></bifi-app-staff-form-dialog>
