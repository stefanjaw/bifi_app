<div class="flex gap-2 mb-4">
  <p-button
    label="Add New"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'clinical/patients/create:view'"
  ></p-button>
</div>
<bifi-app-search-bar label="Search..."></bifi-app-search-bar>
<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="data"
  [onClickRow]="gotoPatientForm"
  clickRowPermission="clinical/patients/update:view"
  [scope]="'clinical'"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(row._id)"
      resource="clinical/patients"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
