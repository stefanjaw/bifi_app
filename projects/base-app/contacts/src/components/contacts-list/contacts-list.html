<h1 class="text-2xl font-bold mb-4">Contacts</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Go Back"
    severity="secondary"
    icon="pi pi-arrow-left"
    [routerLink]="'/home'"
  ></p-button>
  <p-button
    label="Add New Contact"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'contacts/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name, last name, phone number, parent, email, country, state, city, zip code or address"
  [searchFilters]="contactFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="contactColumns"
  [data]="contacts"
  [onClickRow]="goToEditContact"
  clickRowPermission="contacts/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteContact(element._id)"
      resource="contacts"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
