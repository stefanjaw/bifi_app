<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle' | translate: {} : 'base-app/contacts' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'goBack' | translate: {} : 'base-app/contacts'"
    severity="secondary"
    icon="pi pi-arrow-left"
    [routerLink]="'/home'"
  ></p-button>
  <p-button
    [label]="'addNew' | translate: {} : 'base-app/contacts'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'contacts/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchPlaceholder' | translate: {} : 'base-app/contacts'"
  [searchFilters]="contactFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="contactColumns"
  [data]="contacts"
  [onClickRow]="goToEditContact"
  clickRowPermission="contacts/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteContact(element._id)"
      resource="contacts"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
