<h1 class="text-2xl font-bold mb-4">Search</h1>

<p class="text-gray-500 mb-4">
  Manage which phrases route to each destination. Add your team's vocabulary so
  the top-bar search finds the right page.
</p>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Destination"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'search-destinations/create:view'"
  ></p-button>
  <p-button
    label="Sync from menu"
    severity="secondary"
    icon="pi pi-sync"
    [loading]="syncing()"
    (onClick)="syncFromMenu()"
    pTooltip="Discover newly added app destinations without changing existing phrases"
    tooltipPosition="top"
    *bifiAppHasPermission="'search-destinations/update:view'"
  ></p-button>
  <p-button
    [label]="showInactiveStatus() ? 'Show Active' : 'Show Inactive'"
    severity="info"
    [icon]="showInactiveStatus() ? 'pi pi-circle-on' : 'pi pi-circle-off'"
    (onClick)="toggleInactiveRecords()"
  ></p-button>
</div>

<bifi-app-search-bar label="Search by label or phrase"></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="searchDestinationColumns"
  [data]="destinations"
  [onClickRow]="goToEdit"
  clickRowPermission="search-destinations/update:view"
>
  <ng-template #actions let-row>
    @if (row.active) {
      <p-button
        severity="secondary"
        label="Edit"
        icon="pi pi-pencil"
        [routerLink]="['../edit', row._id]"
        *bifiAppHasPermission="'search-destinations/update:view'"
      ></p-button>
      @if (row.isSystem) {
        <p-button
          severity="warn"
          label="Deactivate"
          icon="pi pi-ban"
          (onClick)="setActive(row._id, false)"
          pTooltip="System destination — protected from deletion"
          tooltipPosition="top"
          *bifiAppHasPermission="'search-destinations/update:view'"
        ></p-button>
      } @else {
        <p-button
          severity="danger"
          label="Delete"
          icon="pi pi-trash"
          (onClick)="deleteDestination(row._id)"
          *bifiAppHasPermission="'search-destinations:delete:model'"
        ></p-button>
      }
    } @else {
      <p-button
        severity="secondary"
        label="Reactivate"
        icon="pi pi-eye"
        (onClick)="setActive(row._id, true)"
        *bifiAppHasPermission="'search-destinations/update:view'"
      ></p-button>
    }
  </ng-template>
</bifi-app-table-layout>
