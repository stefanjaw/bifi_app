<div (click)="handleClick()" (keydown)="handleKeyDown($event)" tabindex="0">
  <ng-content>
    <p-fileupload
      #uploader
      [multiple]="true"
      maxFileSize="1000000"
      mode="advanced"
      [customUpload]="true"
      [showUploadButton]="false"
      [disabled]="disabled()"
    >
      <ng-template #empty>
        <div>Drag and drop files to here to upload.</div>
      </ng-template>
    </p-fileupload>
  </ng-content>

  @if (formValue().length > 0) {
    <div class="mt-1"></div>
    <p-button
      variant="text"
      icon="pi pi-trash"
      severity="danger"
      label="Clear"
      (onClick)="onPrimeFileClear()"
    ></p-button>
  }
</div>
