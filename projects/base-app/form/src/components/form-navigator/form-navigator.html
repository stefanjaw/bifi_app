<nav class="w-48 sticky top-4">
  <ul class="flex flex-col">
    @for (s of sections(); track s.id) {
      @let isActive = active() === s.id;

      <li>
        <a
          href="#{{ s.id }}"
          (click)="scrollTo(s); $event.preventDefault()"
          [ngClass]="{
            'block pl-4 py-0.5  border-l text-sm font-sans': true,
            'border-primary-300/50 text-muted-color hover:text-primary-800 hover:border-primary-400 transition-all duration-300 ease-in-out':
              !isActive,
            'border-primary-600 font-semibold text-muted-color-emphasis':
              isActive,
          }"
        >
          {{ s.title }}
        </a>
      </li>
    }
  </ul>
</nav>
