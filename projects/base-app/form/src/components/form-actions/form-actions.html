<section class="col-span-full flex justify-end gap-2">
  <p-button
    type="button"
    [disabled]="isSubmitting()"
    (click)="cancelClicked.emit()"
    variant="outlined"
  >
    Cancel
  </p-button>
  <p-button
    type="submit"
    [icon]="isSubmitting() ? 'pi pi-spinner' : undefined"
    [disabled]="isSubmitting() || formDisabled()"
  >
    {{ isSubmitting() ? 'Saving...' : saveLabel() || 'Save' }}
  </p-button>
</section>
