<section
  class="col-span-full flex {{ position() === 'end' ? 'justify-end' : 'justify-start' }} gap-2"
>
  @if (showCancel()) {
    <p-button
      type="button"
      [disabled]="isSubmitting()"
      (click)="cancelClicked.emit()"
      variant="outlined"
      [label]="cancelLabel() | translate: {} : scope()"
      icon="pi pi-arrow-left"
    ></p-button>
  }
  @if (showSave()) {
    <p-button
      type="submit"
      (onClick)="submitClicked.emit()"
      [icon]="isSubmitting() ? 'pi pi-spinner' : 'pi pi-cloud-upload'"
      [label]="
        isSubmitting()
          ? ('saving' | translate: {} : scope())
          : (saveLabel() || 'save' | translate: {} : scope())
      "
      [disabled]="!formChanged() || isSubmitting() || formDisabled()"
    ></p-button>
  }
</section>
