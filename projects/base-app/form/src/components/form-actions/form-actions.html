<section
  class="col-span-full flex {{ position() === 'end' ? 'justify-end' : 'justify-start' }} gap-2"
>
  <p-button
    type="button"
    [disabled]="isSubmitting()"
    (click)="cancelClicked.emit()"
    variant="outlined"
    [label]="cancelLabel()"
    icon="pi pi-arrow-left"
  ></p-button>
  @if (formChanged()) {
    <p-button
      type="submit"
      (onClick)="submitClicked.emit()"
      [icon]="isSubmitting() ? 'pi pi-spinner' : 'pi pi-cloud-upload'"
      [label]="isSubmitting() ? 'Saving...' : saveLabel() || 'Save'"
      [disabled]="isSubmitting() || formDisabled()"
    ></p-button>
  }
</section>
