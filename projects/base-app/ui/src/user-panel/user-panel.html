<div class="m-0 flex items-center gap-2">
  <p-menu #userMenu [popup]="true" [model]="items()"></p-menu>

  <p-button class="p-0 m-0" aria-label="user panel" variant="text" (click)="openMenu($event)">
    <p-avatar
      [image]="pictureUrl()"
      [icon]="!pictureUrl() ? 'pi pi-user' : undefined"
      [style]="{ width: '32px', height: '32px' }"
      [shape]="'circle'"
    ></p-avatar>
    <span>{{ user()?.contactId?.name || user()?.username }}</span>
  </p-button>
</div>
