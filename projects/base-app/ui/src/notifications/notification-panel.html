<div class="relative">
  <!-- Bell button -->
  <button
    type="button"
    class="relative flex items-center justify-center w-9 h-9 rounded-full hover:bg-surface-100 transition-colors text-surface-700"
    (click)="togglePanel()"
    [attr.aria-label]="'Notifications'"
    #bellBtn
  >
    <span class="pi pi-bell text-xl"></span>
    @if (notificationService.unreadCount() > 0) {
      <span
        class="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center leading-none"
      >
        {{ notificationService.unreadCount() > 99 ? '99+' : notificationService.unreadCount() }}
      </span>
    }
  </button>

  <!-- Dropdown panel -->
  @if (open()) {
    <div
      class="absolute right-0 top-[calc(100%+8px)] w-80 bg-white rounded-xl shadow-2xl border border-surface-200 z-[1000] flex flex-col overflow-hidden"
      #panel
    >
      <!-- Header -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-surface-100">
        <span class="text-sm font-semibold text-surface-800">Notifications</span>
        @if (hasUnread) {
          <button
            type="button"
            class="text-xs text-primary-600 hover:text-primary-800 font-medium"
            (click)="markAllRead()"
          >
            Mark all as read
          </button>
        }
      </div>

      <!-- List -->
      <div class="overflow-y-auto max-h-[400px]">
        @if (notificationService.notifications().length === 0) {
          <div class="flex flex-col items-center justify-center py-10 text-surface-400">
            <span class="pi pi-bell text-3xl mb-2"></span>
            <span class="text-sm">No new notifications</span>
          </div>
        } @else {
          @for (n of notificationService.notifications(); track n._id) {
            <button
              type="button"
              class="w-full flex items-start gap-3 px-4 py-3 hover:bg-surface-50 transition-colors text-left border-b border-surface-50 last:border-0"
              [class.bg-blue-50]="!n.seen"
              (click)="openNotification(n)"
            >
              <div
                class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center mt-0.5"
                [class]="iconBg(n.type)"
              >
                <span class="text-sm" [class]="iconClass(n.type)"></span>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-surface-800 truncate">{{ n.title }}</p>
                @if (n.body) {
                  <p class="text-xs text-surface-500 mt-0.5 line-clamp-2">{{ n.body }}</p>
                }
                <p class="text-[10px] text-surface-400 mt-1">{{ relativeTime(n.createdAt) }}</p>
              </div>
              @if (!n.seen) {
                <span class="shrink-0 w-2 h-2 rounded-full bg-blue-500 mt-2"></span>
              }
            </button>
          }
        }
      </div>
    </div>
  }
</div>
