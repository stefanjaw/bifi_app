@let loggedUser = user();

@if (loggedUser) {
  <p-toolbar class="w-full h-[75px]">
    <ng-template #start>
      <p-button
        icon="pi pi-bars"
        (onClick)="isOpened() ? sidenavManager.closeSidenav() : sidenavManager.openSidenav()"
        variant="text"
        severity="contrast"
      ></p-button>

      <p-button
        [label]="title()"
        (onClick)="goHome()"
        variant="text"
        severity="contrast"
      ></p-button>
    </ng-template>
    <ng-template #end>
      @if (debugManager.debugEnable()) {
        <small class="text-red-500 font-bold me-3">
          Debug is enabled
          <p-button
            size="small"
            label="Desactivate"
            variant="text"
            severity="danger"
            (onClick)="debugManager.toggleDebug()"
          ></p-button>
        </small>
      }

      <div class="flex items-center gap-2">
        <bifi-app-user-panel></bifi-app-user-panel>
      </div>
    </ng-template>
  </p-toolbar>
}

<p-drawer [(visible)]="isOpened" header="Apps">
  <div class="flex flex-col gap-2 w-full">
    @for (menuItem of menuItems(); track $index) {
      @if (menuItem.items) {
        <p-panelmenu
          [model]="[
            {
              label: menuItem.label,
              icon: menuItem.icon,
              items: menuItem.items,
            },
          ]"
        >
          <ng-template #item let-item>
            <a
              *bifiAppHasPermission="`${item['resource']}:read`"
              pRipple
              class="flex items-start p-menu-item-link w-full hover:bg-gray-100 rounded-md px-4 py-2"
              [routerLink]="item.routerLink || undefined"
              (click)="!item.items ? sidenavManager.closeSidenav() : null"
            >
              <span [class]="item.icon"></span>
              <span class="ml-2">{{ item.label }}</span>

              @if (item.items) {
                <span class="pi pi-angle-down ml-auto mt-1"></span>
              }
            </a>
          </ng-template>
        </p-panelmenu>
      } @else {
        <a
          *bifiAppHasPermission="`${menuItem['resource']}:read`"
          pRipple
          class="flex items-start p-menu-item-link w-full hover:bg-gray-100 rounded-md px-4 py-2 ms-1"
          [routerLink]="menuItem.routerLink"
          (click)="sidenavManager.closeSidenav()"
        >
          <span [class]="menuItem.icon"></span>
          <span class="ml-2">{{ menuItem.label }}</span>
        </a>
      }
    }
  </div>
</p-drawer>

<div
  class="w-full overflow-y-auto"
  [ngClass]="{
    'h-[calc(100vh-75px)]': loggedUser,
    'h-[100vh]': !loggedUser,
  }"
>
  <router-outlet></router-outlet>
  <p-toast></p-toast>
  <ngx-sonner-toaster position="bottom-right"></ngx-sonner-toaster>
</div>
