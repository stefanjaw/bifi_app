<section id="main-menu-container">
  <div id="main-menu-options-container">
    @for (item of menuItems(); track $index) {
      <p-button
        [routerLink]="item.routerLink"
        [label]="item.label"
        [icon]="item.icon"
        iconPos="bottom"
        variant="outlined"
      />
    }
  </div>
</section>
