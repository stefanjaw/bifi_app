<form (ngSubmit)="performSearch()" class="w-full flex items-center flex-wrap gap-2">
  <p-iconfield class="flex-1 min-w-48">
    <p-inputicon class="pi pi-search"></p-inputicon>
    <input
      pInputText
      [placeholder]="label()"
      [(ngModel)]="searchText"
      [ngModelOptions]="{ standalone: true }"
      autocomplete="off"
      type="text"
      class="w-full"
    />
    @if (searchText()) {
      <p-inputIcon class="pi pi-times cursor-pointer" (click)="searchText.set('')"></p-inputIcon>
    }
  </p-iconfield>
  <ng-content></ng-content>
</form>
