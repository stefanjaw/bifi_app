<div class="w-full overflow-x-auto">
  @if (layout().items.length === 0) {
    <div class="flex items-center justify-center h-32 text-gray-400 text-sm">
      No timeline items to display.
    </div>
  } @else {
    <svg
      viewBox="0 0 1000 190"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full"
      style="min-width: 600px; height: 190px"
    >
      <!-- Track bar -->
      <rect x="45" y="97" width="910" height="16" rx="8" fill="#1e3a5f" />

      <!-- Month ticks and labels -->
      @for (month of layout().months; track month.x) {
        <line
          [attr.x1]="month.x"
          y1="113"
          [attr.x2]="month.x"
          y2="120"
          stroke="#94a3b8"
          stroke-width="1"
        />
        <text
          [attr.x]="month.x"
          y="132"
          text-anchor="middle"
          font-size="10"
          font-family="sans-serif"
          fill="#64748b"
        >
          {{ month.label }}
        </text>
      }

      <!-- Items -->
      @for (item of layout().items; track item.label + item.x) {
        <g [attr.cursor]="item.action ? 'pointer' : 'default'" (click)="item.action?.()">
          <title>{{ item.fullLabel }} — {{ item.dateLabel }}</title>
          @if (item.above) {
            <!-- Connector line above track -->
            <line
              [attr.x1]="item.x"
              y1="56"
              [attr.x2]="item.x"
              y2="96"
              [attr.stroke]="item.color"
              stroke-width="1.5"
              stroke-dasharray="3,2"
              stroke-opacity="0.7"
            />
            <!-- Item name -->
            <text
              [attr.x]="item.x"
              y="36"
              text-anchor="middle"
              font-size="11"
              font-weight="600"
              font-family="sans-serif"
              fill="#0f172a"
            >
              {{ item.label }}
            </text>
            <!-- Item date -->
            <text
              [attr.x]="item.x"
              y="51"
              text-anchor="middle"
              font-size="10"
              font-family="sans-serif"
              fill="#64748b"
            >
              {{ item.dateLabel }}
            </text>
          } @else {
            <!-- Connector line below track -->
            <line
              [attr.x1]="item.x"
              y1="113"
              [attr.x2]="item.x"
              y2="150"
              [attr.stroke]="item.color"
              stroke-width="1.5"
              stroke-dasharray="3,2"
              stroke-opacity="0.7"
            />
            <!-- Item date -->
            <text
              [attr.x]="item.x"
              y="161"
              text-anchor="middle"
              font-size="10"
              font-family="sans-serif"
              fill="#64748b"
            >
              {{ item.dateLabel }}
            </text>
            <!-- Item name -->
            <text
              [attr.x]="item.x"
              y="175"
              text-anchor="middle"
              font-size="11"
              font-weight="600"
              font-family="sans-serif"
              fill="#0f172a"
            >
              {{ item.label }}
            </text>
          }

          <!-- Marker icon -->
          <polygon
            [attr.points]="item.points"
            [attr.fill]="item.color"
            stroke="white"
            stroke-width="1.5"
          />
        </g>
      }
    </svg>
  }
</div>
