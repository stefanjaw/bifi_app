<div class="w-full overflow-x-auto">
  @if (layout().items.length === 0) {
    <div class="flex items-center justify-center h-32 text-gray-400 text-sm">
      {{ 'timeline.empty' | translate: {} : 'base-app/resource' }}
    </div>
  } @else {
    <svg
      [attr.viewBox]="layout().viewBox"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full"
      [style.height.px]="layout().svgHeight"
      style="min-width: 600px"
    >
      <!-- Track -->
      <rect x="45" y="97" width="910" height="16" rx="8" fill="#1e3a5f" />

      <!-- Months -->
      @for (month of layout().months; track month.x) {
        <line [attr.x1]="month.x" y1="113" [attr.x2]="month.x" y2="120" stroke="#94a3b8" />
        <text [attr.x]="month.x" y="132" text-anchor="middle" font-size="10" fill="#64748b">
          {{ month.label }}
        </text>
      }

      <!-- Items -->
      @for (item of layout().items; track item.fullLabel + item.x) {
        <g [attr.cursor]="item.action ? 'pointer' : 'default'" (click)="item.action?.()">
          <title>{{ item.fullLabel }} — {{ item.dateLabel }}</title>

          @if (item.above) {
            <!-- Connector: from label bottom to track top — anchored to real x -->
            <line
              [attr.x1]="item.x"
              [attr.y1]="56 - item.level * LEVEL_HEIGHT"
              [attr.x2]="item.x"
              y2="96"
              [attr.stroke]="item.color"
              stroke-width="1.5"
              stroke-dasharray="3,2"
              stroke-opacity="0.7"
            />
            <!-- Item name — uses nudged labelX -->
            <text
              [attr.x]="item.labelX"
              [attr.y]="36 - item.level * LEVEL_HEIGHT"
              text-anchor="middle"
              font-size="11"
              font-weight="600"
              font-family="sans-serif"
              fill="#0f172a"
            >
              {{ item.label }}
            </text>
            <!-- Item date — uses nudged labelX -->
            <text
              [attr.x]="item.labelX"
              [attr.y]="51 - item.level * LEVEL_HEIGHT"
              text-anchor="middle"
              font-size="10"
              font-family="sans-serif"
              fill="#64748b"
            >
              {{ item.dateLabel }}
            </text>
          } @else {
            <!-- Connector: from track bottom down — anchored to real x -->
            <line
              [attr.x1]="item.x"
              y1="113"
              [attr.x2]="item.x"
              [attr.y2]="150 + item.level * LEVEL_HEIGHT"
              [attr.stroke]="item.color"
              stroke-width="1.5"
              stroke-dasharray="3,2"
              stroke-opacity="0.7"
            />
            <!-- Item date — uses nudged labelX -->
            <text
              [attr.x]="item.labelX"
              [attr.y]="161 + item.level * LEVEL_HEIGHT"
              text-anchor="middle"
              font-size="10"
              font-family="sans-serif"
              fill="#64748b"
            >
              {{ item.dateLabel }}
            </text>
            <!-- Item name — uses nudged labelX -->
            <text
              [attr.x]="item.labelX"
              [attr.y]="175 + item.level * LEVEL_HEIGHT"
              text-anchor="middle"
              font-size="11"
              font-weight="600"
              font-family="sans-serif"
              fill="#0f172a"
            >
              {{ item.label }}
            </text>
          }

          <!-- Marker always at the true date x position -->
          <polygon
            [attr.points]="item.points"
            [attr.fill]="item.color"
            stroke="white"
            stroke-width="1.5"
          />
        </g>
      }
    </svg>
  }
</div>
