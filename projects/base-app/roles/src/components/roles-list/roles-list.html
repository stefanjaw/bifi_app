<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle' | translate: {} : 'base-app/roles' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNew' | translate: {} : 'base-app/roles'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'roles/create:view'"
  ></p-button>
  <p-button
    [label]="'exportCsv' | translate: {} : 'base-app/roles'"
    severity="secondary"
    icon="pi pi-download"
    (click)="exportCsv()"
    *bifiAppHasPermission="'roles/export:read:model'"
  ></p-button>
  <p-button
    [label]="'importCsv' | translate: {} : 'base-app/roles'"
    severity="secondary"
    icon="pi pi-upload"
    (onClick)="importInput.click()"
    [disabled]="isImporting()"
    *bifiAppHasPermission="'roles/import:create:model'"
  ></p-button>
  <input
    type="file"
    accept=".csv"
    #importInput
    class="hidden"
    (change)="importCsv($event)"
  />
</div>

<bifi-app-search-bar
  [label]="'searchPlaceholder' | translate: {} : 'base-app/roles'"
  [searchFilters]="roleFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="roleColumns"
  [data]="roles"
  [onClickRow]="goToEditRole"
  clickRowPermission="roles/update:view"
  [scope]="'base-app/roles'"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteRole(row._id)"
      resource="roles"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
