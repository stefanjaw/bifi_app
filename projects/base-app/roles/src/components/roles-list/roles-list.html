<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle' | translate: {} : 'base-app/roles' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNew' | translate: {} : 'base-app/roles'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'roles/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar [label]="'searchPlaceholder' | translate: {} : 'base-app/roles'" [searchFilters]="roleFilters"></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="roleColumns"
  [data]="roles"
  [onClickRow]="goToEditRole"
  clickRowPermission="roles/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteRole(row._id)"
      resource="roles"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
