<p-dialog
  [header]="'selectPolicy.header' | translate: {} : 'base-app/roles'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md"
>
  <bifi-app-form-field class="mb-8 min-h-40">
    <bifi-app-form-label>
      {{ 'selectPolicy.policyLabel' | translate: {} : 'base-app/roles' }}
    </bifi-app-form-label>
    <p-multiSelect
      appendTo="body"
      [formControl]="policy"
      [options]="policies()"
      optionLabel="name"
      optionValue="_id"
      [filter]="true"
    ></p-multiSelect>
    <bifi-app-form-error></bifi-app-form-error>
  </bifi-app-form-field>

  <bifi-app-form-actions
    [isSubmitting]="false"
    [formDisabled]="!policy.valid || !policy.value"
    (submitClicked)="handleSubmit()"
    (cancelClicked)="closeDialog()"
    [cancelLabel]="'selectPolicy.cancel' | translate: {} : 'base-app/roles'"
    [saveLabel]="'selectPolicy.add' | translate: {} : 'base-app/roles'"
    [formChanged]="true"
  ></bifi-app-form-actions>
</p-dialog>
