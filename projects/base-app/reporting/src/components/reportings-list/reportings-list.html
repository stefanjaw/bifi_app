<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle' | translate: {} : 'base-app/reporting' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'addNew' | translate: {} : 'base-app/reporting'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'reporting/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchPlaceholder' | translate: {} : 'base-app/reporting'"
  [searchFilters]="reportingFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [infiniteScroll]="true" [columns]="reportingColumns" [data]="reportings" [scope]="'base-app/reporting'">
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      [label]="'edit' | translate: {} : 'base-app/reporting'"
      icon="pi pi-pencil"
      (onClick)="goToEdit(element._id)"
      *bifiAppHasPermission="'reporting/update:view'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'reporting:delete:model'"
      severity="danger"
      [label]="'delete' | translate: {} : 'base-app/reporting'"
      (onClick)="deleteReporting(element._id)"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
