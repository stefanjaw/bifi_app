<h1 class="text-2xl font-bold mb-4">Reporting Templates</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Reporting Template"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'reporting/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by model or title"
  [searchFilters]="reportingFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true" [columns]="reportingColumns" [data]="reportings">
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      (onClick)="goToEdit(element._id)"
      *bifiAppHasPermission="'reporting/update:view'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'reporting:delete:model'"
      severity="danger"
      label="Delete"
      (onClick)="deleteReporting(element._id)"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
