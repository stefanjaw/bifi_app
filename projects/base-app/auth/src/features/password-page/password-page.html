<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <bifi-app-form-layout title="">
      <form
        ngProjectAs="div"
        [formGroup]="form"
        bifiAppFormActionsHandler
        (appSubmit)="sendEmail($event)"
        class="space-y-6"
      >
        <bifi-app-form-section title="Reset Password" id="send-email" [ordinal]="1">
          <section class="flex flex-col gap-4">
            <!-- Email/Username Field -->
            <bifi-app-form-field>
              <bifi-app-form-label>Email</bifi-app-form-label>
              <input
                pInputText
                formControlName="email"
                placeholder="user@example.com"
                autocomplete="email"
              />
              <bifi-app-form-error></bifi-app-form-error>
            </bifi-app-form-field>

            <!-- Button send email -->

            <bifi-app-form-actions
              [isSubmitting]="isSubmitLoading()"
              saveLabel="Send Email"
              (cancelClicked)="goBack()"
              [formChanged]="form.dirty"
            ></bifi-app-form-actions>
          </section>

          <div class="mt-6 text-center">
            <p class="text-sm text-green-600">
              {{
                emailSent()
                  ? 'If the email exists, a reset link has been sent. Please check your inbox, and if you don’t see it, check your spam folder.'
                  : ''
              }}
            </p>
          </div>
        </bifi-app-form-section>
      </form>
    </bifi-app-form-layout>
  </div>
</div>
