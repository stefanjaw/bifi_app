<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <bifi-app-form-layout title="">
      <form
        ngProjectAs="div"
        [formGroup]="form"
        bifiAppFormActionsHandler
        (appSubmit)="sendEmail($event)"
        class="space-y-6"
      >
        <bifi-app-form-section
          [title]="'resetPassword.title' | translate: {} : 'base-app/auth'"
          id="send-email"
          [ordinal]="1"
        >
          <section class="flex flex-col gap-4">
            <!-- Email/Username Field -->
            <bifi-app-form-field>
              <bifi-app-form-label>
                {{ 'resetPassword.email' | translate: {} : 'base-app/auth' }}
              </bifi-app-form-label>
              <input
                pInputText
                formControlName="email"
                [placeholder]="'resetPassword.emailPlaceholder' | translate: {} : 'base-app/auth'"
                autocomplete="email"
              />
              <bifi-app-form-error></bifi-app-form-error>
            </bifi-app-form-field>

            <!-- Button send email -->

            <bifi-app-form-actions
              [isSubmitting]="isSubmitLoading()"
              [saveLabel]="'resetPassword.sendEmail' | translate: {} : 'base-app/auth'"
              (cancelClicked)="goBack()"
              [formChanged]="form.dirty"
            ></bifi-app-form-actions>
          </section>

          <div class="mt-6 text-center">
            <p class="text-sm text-green-600">
              {{
                emailSent()
                  ? ('resetPassword.successMessage' | translate: {} : 'base-app/auth')
                  : ''
              }}
            </p>
          </div>
        </bifi-app-form-section>
      </form>
    </bifi-app-form-layout>
  </div>
</div>
