<p-dialog
  [header]="'accessToken.title' | translate: {} : 'base-app/auth'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-md"
>
  <div class="flex flex-col gap-4">
    <textarea pTextarea disabled class="field-sizing-content">{{ token() }}</textarea>

    <p-button
      icon="pi pi-copy"
      variant="text"
      [label]="'accessToken.copyToClipboard' | translate: {} : 'base-app/auth'"
      [cdkCopyToClipboard]="token() || ''"
      (cdkCopyToClipboardCopied)="showTokenCopiedToast()"
    ></p-button>
  </div>
</p-dialog>
