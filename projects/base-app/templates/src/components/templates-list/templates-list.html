<h1 class="text-2xl font-bold mb-4">Templates</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Template"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'templates/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by model and template"
  [searchFilters]="templateFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="templateColumns" [data]="reportings">
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      (onClick)="goToEdit(element._id)"
      *bifiAppHasPermission="'templates/update:view'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'templates:delete:model'"
      severity="danger"
      label="Delete"
      (onClick)="deleteTemplate(element._id)"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
