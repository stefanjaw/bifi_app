<bifi-app-form-layout
  [title]="isUpdate() ? 'Edit Sequence' : 'New Sequence'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Sequence Details" id="sequence-details" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input pInputText formControlName="name" placeholder="e.g. Invoice Sequence" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Description</bifi-app-form-label>
            <textarea pTextarea formControlName="description" rows="1" placeholder="Optional description"></textarea>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>

      <bifi-app-form-section title="Numbering Configuration" id="sequence-numbering" [ordinal]="2">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Prefix *</bifi-app-form-label>
            <input pInputText formControlName="prefix" placeholder="e.g. INV/" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Suffix</bifi-app-form-label>
            <input pInputText formControlName="suffix" placeholder="e.g. /2026" />
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Next Number *</bifi-app-form-label>
            <p-inputNumber formControlName="number" [min]="0"></p-inputNumber>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Step *</bifi-app-form-label>
            <p-inputNumber formControlName="step" [min]="1"></p-inputNumber>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Padding Size *</bifi-app-form-label>
            <p-inputNumber formControlName="size" [min]="1"></p-inputNumber>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
          <bifi-app-form-field>
            <bifi-app-form-label>No Gap</bifi-app-form-label>
            <p-toggleSwitch formControlName="nogap"></p-toggleSwitch>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Active</bifi-app-form-label>
            <p-toggleSwitch formControlName="active"></p-toggleSwitch>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>

      <bifi-app-form-section title="Preview" id="sequence-preview" [ordinal]="3">
        <div class="flex items-center gap-4 p-4 bg-white rounded-lg border border-gray-200">
          <span class="text-gray-500 text-sm">Next generated number:</span>
          <span class="text-xl font-mono font-semibold text-primary">{{ previewNumber() }}</span>
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }

    @if (error()) {
      <p class="text-red-500">Something went wrong: {{ error() }}</p>
    }
  </form>
</bifi-app-form-layout>
