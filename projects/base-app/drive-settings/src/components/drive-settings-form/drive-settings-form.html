<bifi-app-form-layout
  [title]="'pageTitle' | translate: {} : 'base-app/drive-settings'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section
        [title]="'serviceAccount.sectionTitle' | translate: {} : 'base-app/drive-settings'"
        id="service-account"
        [ordinal]="1"
      >
        <p class="text-sm text-gray-500 mb-4">
          {{ 'serviceAccount.description' | translate: {} : 'base-app/drive-settings' }}
        </p>

        <bifi-app-form-field>
          <bifi-app-form-label>
            {{ 'serviceAccount.keyLabel' | translate: {} : 'base-app/drive-settings' }}
          </bifi-app-form-label>
          <textarea
            pInputTextarea
            formControlName="serviceAccountKey"
            [placeholder]="
              'serviceAccount.keyPlaceholder' | translate: {} : 'base-app/drive-settings'
            "
            rows="4"
            class="w-full font-mono text-xs"
          ></textarea>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </bifi-app-form-section>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
