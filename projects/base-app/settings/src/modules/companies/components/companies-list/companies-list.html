<h1 class="text-2xl font-bold mb-4">Companies</h1>

<bifi-app-search-bar
  label="Search by name and address"
  [searchFilters]="companyFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="companyColumns" [data]="companies">
  <ng-template #actions>
    <p-button
      *bifiAppHasPermission="'companies:update'"
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'companies:delete'"
      severity="danger"
      label="Delete"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
