<h1 class="text-2xl font-bold mb-4">Roles</h1>

<bifi-app-search-bar label="Search by name" [searchFilters]="roleFilters"></bifi-app-search-bar>

<bifi-app-table-layout [columns]="roleColumns" [data]="roles">
  <ng-template #actions>
    <p-button severity="secondary" label="Edit" icon="pi pi-pencil"></p-button>
    <p-button severity="danger" label="Delete" icon="pi pi-trash"></p-button>
  </ng-template>
</bifi-app-table-layout>
