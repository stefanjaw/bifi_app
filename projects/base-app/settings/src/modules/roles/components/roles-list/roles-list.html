<h1 class="text-2xl font-bold mb-4">Roles</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Role"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'roles:create'"
  ></p-button>
</div>

<bifi-app-search-bar label="Search by name" [searchFilters]="roleFilters"></bifi-app-search-bar>

<bifi-app-table-layout [columns]="roleColumns" [data]="roles">
  <ng-template #actions let-row>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      [routerLink]="['../edit/', row._id]"
      *bifiAppHasPermission="'roles:update'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'roles:delete'"
      severity="danger"
      label="Delete"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
