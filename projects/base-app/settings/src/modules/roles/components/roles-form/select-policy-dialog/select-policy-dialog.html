<p-dialog
  header="Select Policy"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md"
>
  <bifi-app-form-field class="mb-8 min-h-40">
    <bifi-app-form-label>Policy</bifi-app-form-label>
    <p-multiSelect
      [formControl]="policy"
      [options]="policies()"
      optionLabel="name"
      optionValue="_id"
      [filter]="true"
    ></p-multiSelect>
    <bifi-app-form-error></bifi-app-form-error>
  </bifi-app-form-field>

  <bifi-app-form-actions
    [isSubmitting]="false"
    [formDisabled]="!policy.valid || !policy.value"
    (submitClicked)="handleSubmit()"
    (cancelClicked)="closeDialog()"
    cancelLabel="Cancel"
  ></bifi-app-form-actions>
</p-dialog>
