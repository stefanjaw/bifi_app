<h1 class="text-2xl font-bold mb-4">Policies</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Policy"
    severity="secondary"
    icon="pi pi-plus"
    (onClick)="currPolicy.set(undefined); dialog.openDialog()"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by resource and action"
  [searchFilters]="policyFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="policyColumns" [data]="policies">
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      (onClick)="currPolicy.set(element); dialog.openDialog()"
    ></p-button>
    <p-button severity="danger" label="Delete" icon="pi pi-trash"></p-button>
  </ng-template>
</bifi-app-table-layout>

<bifi-app-policy-form-dialog
  #dialog
  [policy]="currPolicy()"
  (policySaved)="policies.reload()"
></bifi-app-policy-form-dialog>
