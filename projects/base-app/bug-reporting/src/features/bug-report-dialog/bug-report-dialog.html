<p-dialog
  [header]="'title' | translate: {} : 'base-app/bug-reporting'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
  >
    <bifi-app-form-field>
      <bifi-app-form-label>{{ 'subject' | translate: {} : 'base-app/bug-reporting' }}</bifi-app-form-label>
      <input pInputText formControlName="name" type="text" [placeholder]="'subjectPlaceholder' | translate: {} : 'base-app/bug-reporting'" />
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-field>
      <bifi-app-form-label>{{ 'description' | translate: {} : 'base-app/bug-reporting' }}</bifi-app-form-label>
      <textarea
        pInputTextarea
        formControlName="description"
        rows="3"
        type="text"
        [placeholder]="'descriptionPlaceholder' | translate: {} : 'base-app/bug-reporting'"
      ></textarea>
      <bifi-app-form-error></bifi-app-form-error>
    </bifi-app-form-field>

    <bifi-app-form-uploader formArrayName="files">
      <p-fileUpload
        showUploadButton="false"
        name="files"
        [multiple]="false"
        maxFileSize="100000000"
        mode="basic"
        [showCancelButton]="false"
      ></p-fileUpload>
    </bifi-app-form-uploader>

    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="closeDialog()"
      [cancelLabel]="'cancel' | translate: {} : 'base-app/bug-reporting'"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>
  </form>
</p-dialog>
