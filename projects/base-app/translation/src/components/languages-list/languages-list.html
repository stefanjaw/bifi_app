<h1 class="text-2xl font-bold mb-4">
  {{ 'languages.pageTitle' | translate: {} : 'base-app/translation' }}
</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'languages.addNew' | translate: {} : 'base-app/translation'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'languages/create:view'"
  ></p-button>
  <p-button
    [label]="'languages.downloadCsv' | translate: {} : 'base-app/translation'"
    severity="secondary"
    icon="pi pi-download"
    (click)="downloadCsv()"
    *bifiAppHasPermission="'languages/export:read:model'"
  ></p-button>
  <p-button
    [label]="'languages.importCsv' | translate: {} : 'base-app/translation'"
    severity="secondary"
    icon="pi pi-upload"
    (onClick)="importInput.click()"
    [disabled]="isImporting()"
    *bifiAppHasPermission="'languages/import:create:model'"
  ></p-button>
  <input
    type="file"
    accept=".csv"
    #importInput
    class="hidden"
    (change)="importCsv($event)"
  />
</div>

<bifi-app-search-bar
  [label]="'languages.searchPlaceholder' | translate: {} : 'base-app/translation'"
  [searchFilters]="languageFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="languageColumns"
  [data]="languages"
  [onClickRow]="goToEdit"
  clickRowPermission="languages/update:view"
  [scope]="'base-app/translation'"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (editClicked)="goToEdit(element)"
      (deleteClicked)="deleteLanguage(element._id)"
      resource="languages"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
