<h1 class="text-2xl font-bold mb-4">Policies</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Policy"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'policies/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name, resource and action"
  [searchFilters]="policyFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [columns]="policyColumns"
  [data]="policies"
  [onClickRow]="gotoEditPolicy"
  clickRowPermission="policies/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deletePolicy(element._id)"
      resource="policies"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
