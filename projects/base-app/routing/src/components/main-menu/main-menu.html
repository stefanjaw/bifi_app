<section id="main-menu-container" class="relative pt-16">
  <h1
    class="absolute top-4 left-1/3 -translate-x-1/2 text-2xl font-bold text-primary-500 bg-white px-6 py-15"
  >
    {{ mainMenuTitle() }}
  </h1>
  <div id="main-menu-options-container">
    @for (item of menuItems(); track $index) {
      @if (item['showInMainMenu']) {
        <a
          [routerLink]="item.routerLink"
          class="bg-white rounded-xl p-6 shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 ease-in-out border-t-4 border-primary-500 flex items-start gap-4 h-[80px] w-[230px]"
          *bifiAppHasPermission="item['resource'] ? `${item['resource']}:menu` : undefined"
        >
          <span [bifiAppIcon]="'lg'" [class]="item.icon"></span>
          <span class="w-full overflow-ellipsis text-nowrap overflow-hidden text-center">
            {{ item.label }}
          </span>
        </a>
      }
    }
  </div>
</section>
