<h1 class="text-2xl font-bold mb-4">Payment Terms</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Payment Term"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../payment-terms/create']"
    *bifiAppHasPermission="'accounting/payment-terms/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="paymentTerms"
  [onClickRow]="gotoEditPaymentTerm"
  clickRowPermission="accounting/payment-terms/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="accounting/payment-terms"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
