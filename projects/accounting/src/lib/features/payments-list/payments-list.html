<h1 class="text-2xl font-bold mb-4">Payments</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Payment"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../payments/create']"
    *bifiAppHasPermission="'accounting/payments/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout [columns]="columns" [data]="payments" [onClickRow]="goToEditPayment" clickRowPermission="accounting/payments/update:view">

  <bifi-app-buttons-actions
