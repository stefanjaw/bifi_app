<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle.payments' | translate: {} : 'accounting' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'buttons.newPayment' | translate: {} : 'accounting'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../payments/create']"
    *bifiAppHasPermission="'accounting/payments/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'accounting'"
  [columns]="columns"
  [data]="payments"
  [onClickRow]="goToEditPayment"
  clickRowPermission="accounting/payments/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="accounting/payments"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
