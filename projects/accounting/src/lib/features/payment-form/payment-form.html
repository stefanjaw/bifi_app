<bifi-app-form-layout title="New Payment" titlePosition="center" class="block px-4 bg-gray-50 py-4">
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Payment Details" id="payment-details" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Payment Type *</bifi-app-form-label>
            <p-select
              formControlName="paymentType"
              [options]="paymentTypeOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Select type"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Partner</bifi-app-form-label>
            <p-select
              formControlName="partnerId"
              [options]="contacts() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select partner"
              [filter]="true"
              [showClear]="true"
            ></p-select>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Journal *</bifi-app-form-label>
            <p-select
              formControlName="journalId"
              [options]="journals() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select journal"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Currency *</bifi-app-form-label>
            <p-select
              formControlName="currencyId"
              [options]="currencies() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select currency"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Amount *</bifi-app-form-label>
            <p-inputNumber
              formControlName="amount"
              [min]="0"
              [minFractionDigits]="2"
              placeholder="0.00"
            ></p-inputNumber>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Payment Date *</bifi-app-form-label>
            <p-datepicker
              formControlName="paymentDate"
              placeholder="Select date"
              [showIcon]="true"
            ></p-datepicker>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Reference</bifi-app-form-label>
            <input pInputText formControlName="reference" placeholder="e.g. REF-001" />
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Exchange Rate</bifi-app-form-label>
            <p-inputNumber
              formControlName="exchangeRate"
              [min]="0"
              [minFractionDigits]="4"
              placeholder="1.0000"
            ></p-inputNumber>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
