<bifi-app-form-layout
  [title]="isUpdate() ? 'Edit Tax' : 'New Tax'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Tax Details" id="tax-details" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input pInputText formControlName="name" placeholder="e.g. VAT 15%" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Tax Type *</bifi-app-form-label>
            <p-select
              formControlName="taxType"
              [options]="taxTypeOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Select type"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Percentage (%) *</bifi-app-form-label>
            <p-inputNumber
              formControlName="percentage"
              [min]="0"
              [max]="100"
              suffix="%"
              placeholder="e.g. 15"
            ></p-inputNumber>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Account *</bifi-app-form-label>
            <p-select
              formControlName="accountId"
              [options]="accounts() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select account"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          @if (isUpdate()) {
            <bifi-app-form-field>
              <bifi-app-form-label>Active</bifi-app-form-label>
              <p-toggleSwitch formControlName="active"></p-toggleSwitch>
            </bifi-app-form-field>
          }
        </div>
      </bifi-app-form-section>

      <bifi-app-plugin-slot name="tax-form-general-information"></bifi-app-plugin-slot>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
