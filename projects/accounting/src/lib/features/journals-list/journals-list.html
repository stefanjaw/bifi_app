<h1 class="text-2xl font-bold mb-4">Journals</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Journal"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../journals/create']"
    *bifiAppHasPermission="'accounting/journals/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout [columns]="columns" [data]="journals">
  <ng-template #actions let-element>
    <p-button
      *bifiAppHasPermission="'accounting/journals/update:view'"
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      routerLink="../journals/edit/{{ element._id }}"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'accounting/journals:delete:model'"
      severity="danger"
      icon="pi pi-trash"
      (onClick)="delete(element._id)"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
