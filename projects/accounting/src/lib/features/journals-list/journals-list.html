<h1 class="text-2xl font-bold mb-4">Journals</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Journal"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../journals/create']"
    *bifiAppHasPermission="'accounting/journals/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [columns]="columns"
  [data]="journals"
  [onClickRow]="goToEditJournal"
  clickRowPermission="accounting/journals/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="accounting/journals"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
