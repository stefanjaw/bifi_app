<h1 class="text-2xl font-bold mb-4">Fiscal Positions</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Fiscal Position"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../fiscal-positions/create']"
    *bifiAppHasPermission="'accounting/fiscal-positions/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [columns]="columns"
  [data]="fiscalPositions"
  [onClickRow]="goToEditFiscalPosition"
  clickRowPermission="accounting/fiscal-positions/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteFiscalPosition(element._id)"
      resource="accounting/fiscal-positions"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
