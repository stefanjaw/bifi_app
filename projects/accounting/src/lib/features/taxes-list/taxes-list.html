<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle.taxes' | translate: {} : 'accounting' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'buttons.addNewTax' | translate: {} : 'accounting'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../taxes/create']"
    *bifiAppHasPermission="'accounting/taxes/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'accounting'"
  [columns]="columns"
  [data]="taxes"
  [onClickRow]="goToEditTax"
  clickRowPermission="accounting/taxes/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="accounting/taxes"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
