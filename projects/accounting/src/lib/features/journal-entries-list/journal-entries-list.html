<h1 class="text-2xl font-bold mb-4">
  {{ 'pageTitle.journalEntries' | translate: {} : 'accounting' }}
</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'buttons.newJournalEntry' | translate: {} : 'accounting'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../journal-entries/create']"
    *bifiAppHasPermission="'accounting/journal-entries/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'accounting'"
  [columns]="columns"
  [data]="entries"
  [onClickRow]="goToEditEntry"
  clickRowPermission="accounting/journal-entries/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="accounting/journal-entries"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
