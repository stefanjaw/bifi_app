<h1 class="text-2xl font-bold mb-4">Journal Entries</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Journal Entry"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../journal-entries/create']"
    *bifiAppHasPermission="'accounting/journal-entries/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout [columns]="columns" [data]="entries">
  <ng-template #actions let-element>
    <p-button
      *bifiAppHasPermission="'accounting/journal-entries/update:view'"
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      routerLink="../journal-entries/edit/{{ element._id }}"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'accounting/journal-entries:delete:model'"
      severity="danger"
      icon="pi pi-trash"
      (onClick)="delete(element._id)"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
