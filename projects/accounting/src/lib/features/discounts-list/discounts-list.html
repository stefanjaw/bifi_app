<h1 class="text-2xl font-bold mb-4">Discounts</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Discount"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../discounts/create']"
    *bifiAppHasPermission="'accounting/discounts/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="discounts"
  [onClickRow]="goToEditDiscount"
  clickRowPermission="accounting/discounts/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteDiscount(element._id)"
      resource="accounting/discounts"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
