<bifi-app-form-layout
  [title]="isUpdate() ? 'Edit Journal' : 'New Journal'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Journal Details" id="journal-details" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input pInputText formControlName="name" placeholder="e.g. Customer Invoices" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Code *</bifi-app-form-label>
            <input pInputText formControlName="code" placeholder="e.g. INV" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Type *</bifi-app-form-label>
            <p-select
              formControlName="journalType"
              [options]="journalTypeOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Select type"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Currency</bifi-app-form-label>
            <p-select
              formControlName="currencyId"
              [options]="currencies() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select currency"
              [filter]="true"
              [showClear]="true"
            ></p-select>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Default Debit Account</bifi-app-form-label>
            <p-select
              formControlName="defaultDebitAccountId"
              [options]="accounts() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select account"
              [filter]="true"
              [showClear]="true"
            ></p-select>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Default Credit Account</bifi-app-form-label>
            <p-select
              formControlName="defaultCreditAccountId"
              [options]="accounts() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select account"
              [filter]="true"
              [showClear]="true"
            ></p-select>
          </bifi-app-form-field>

          @if (isUpdate()) {
            <bifi-app-form-field>
              <bifi-app-form-label>Active</bifi-app-form-label>
              <p-toggleSwitch formControlName="active"></p-toggleSwitch>
            </bifi-app-form-field>
          }
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
