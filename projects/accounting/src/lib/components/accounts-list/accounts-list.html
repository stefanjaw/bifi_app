<h1 class="text-2xl font-bold mb-4">Chart of Accounts</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Account"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../accounts/create']"
    *bifiAppHasPermission="'accounting/accounts/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout [columns]="columns" [data]="accounts">
  <ng-template #actions let-element>
    <p-button
      *bifiAppHasPermission="'accounting/accounts/update:view'"
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      routerLink="../accounts/edit/{{ element._id }}"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'accounting/accounts:delete:model'"
      severity="danger"
      label="Delete"
      icon="pi pi-trash"
      (onClick)="delete(element._id)"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
