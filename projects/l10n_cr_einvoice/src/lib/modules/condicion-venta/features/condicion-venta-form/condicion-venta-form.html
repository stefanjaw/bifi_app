<bifi-app-form-layout
  [title]="isUpdate() ? 'Editar Condición de Venta' : 'Nueva Condición de Venta'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section title="Información" id="info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Code</bifi-app-form-label>
            <input pInputText formControlName="code" placeholder="e.g. 01" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
          <bifi-app-form-field>
            <bifi-app-form-label>Description</bifi-app-form-label>
            <input pInputText formControlName="description" placeholder="Description" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else if (error()) {
      <p>Error loading data: {{ error() }}</p>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
