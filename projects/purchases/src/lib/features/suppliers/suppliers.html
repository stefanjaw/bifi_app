<h1 class="text-2xl font-bold mb-4">{{ 'pageTitle.suppliers' | translate: {} : 'purchases' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="
      (showAll() ? 'buttons.showSuppliersOnly' : 'buttons.showAllContacts')
        | translate: {} : 'purchases'
    "
    [icon]="showAll() ? 'pi pi-filter' : 'pi pi-users'"
    severity="secondary"
    (onClick)="toggleShowAll()"
  ></p-button>
</div>

<bifi-app-table-layout
  [scope]="'purchases'"
  [infiniteScroll]="true"
  [columns]="supplierColumns"
  [data]="entries"
  clickRowPermission="purchases/suppliers/read:view"
>
  <ng-template #actions let-element>
    <p-button
      severity="info"
      [label]="'buttons.view' | translate: {} : 'purchases'"
      icon="pi pi-eye"
      routerLink="../suppliers/{{ element._id }}"
      *bifiAppHasPermission="'purchases/suppliers/read:view'"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
