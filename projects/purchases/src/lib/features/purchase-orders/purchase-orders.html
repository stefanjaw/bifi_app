<h1 class="text-2xl font-bold mb-4">Purchase Orders</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Order"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../orders/new']"
    *bifiAppHasPermission="'purchases/orders/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by order number, supplier or status"
  [searchFilters]="purchaseOrderFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="purchaseOrderColumns" [data]="entries">
  <ng-template #actions let-element>
    <p-button
      severity="info"
      label="View"
      icon="pi pi-eye"
      routerLink="../orders/{{ element._id }}"
    ></p-button>
    @if (element.status !== 'cancelled' && element.status !== 'received') {
      <p-button
        *bifiAppHasPermission="'purchases/orders:delete:model'"
        severity="danger"
        label="Cancel"
        icon="pi pi-times"
        (onClick)="cancelOrder(element._id)"
      ></p-button>
    }
  </ng-template>
</bifi-app-table-layout>
