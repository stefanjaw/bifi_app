<h1 class="text-2xl font-bold mb-4">Purchase Orders</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Order"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../orders/new']"
    *bifiAppHasPermission="'purchases/orders/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by order number, supplier or status"
  [searchFilters]="purchaseOrderFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="purchaseOrderColumns"
  [data]="entries"
  [onClickRow]="onClickRow"
  clickRowPermission="purchases/orders/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteEntry(element._id)"
      [showDelete]="element.status === 'cancelled'"
      resource="purchases/orders"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
