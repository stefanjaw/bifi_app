<p-dialog
  [header]="'selectContact.title' | translate: {} : 'purchases'"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-lg"
>
  <bifi-app-form-field class="mb-8 min-h-40">
    <bifi-app-form-label>
      {{ 'selectContact.contact' | translate: {} : 'purchases' }}
    </bifi-app-form-label>
    <p-select
      appendTo="body"
      [formControl]="contact"
      [options]="contacts()"
      optionLabel="fullName"
      optionValue="_id"
      [filter]="true"
      filterBy="fullName,email,phoneNumber"
      [placeholder]="'selectContact.placeholder' | translate: {} : 'purchases'"
    ></p-select>
    <bifi-app-form-error></bifi-app-form-error>
  </bifi-app-form-field>

  <bifi-app-form-actions
    [isSubmitting]="false"
    [formDisabled]="!contact.value"
    (submitClicked)="handleSubmit()"
    (cancelClicked)="closeDialog()"
    [cancelLabel]="'buttons.cancel' | translate: {} : 'purchases'"
    [saveLabel]="'buttons.select' | translate: {} : 'purchases'"
    [formChanged]="true"
  ></bifi-app-form-actions>
</p-dialog>
