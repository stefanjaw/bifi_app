<h1 class="text-2xl font-bold mb-4">Purchase Stages</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Stage"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name"
  [searchFilters]="purchaseStageFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="purchaseStageColumns" [data]="purchaseStages">
  <ng-template #actions let-row>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      [routerLink]="['../edit/', row._id]"
    ></p-button>
    <p-button
      severity="danger"
      label="Delete"
      (onClick)="deleteStage(row._id)"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
