<h1 class="text-2xl font-bold mb-4">Purchase Stages</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Stage"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'purchase-stages/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name"
  [searchFilters]="purchaseStageFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [columns]="purchaseStageColumns"
  [data]="purchaseStages"
  [onClickRow]="goToEditStage"
  clickRowPermission="purchase-stages/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteStage(row._id)"
      resource="purchase-stages"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
