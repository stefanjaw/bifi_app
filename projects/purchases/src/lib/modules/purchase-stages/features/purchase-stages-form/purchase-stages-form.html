<bifi-app-form-layout
  [title]="
    (isUpdate() ? 'form.title.updateStage' : 'form.title.createStage') | translate: {} : 'purchases'
  "
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section
        [title]="'form.stageInfo' | translate: {} : 'purchases'"
        id="stage-info"
        [ordinal]="1"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>{{ 'name' | translate: {} : 'purchases' }} *</bifi-app-form-label>
            <input
              pInputText
              formControlName="name"
              type="text"
              [placeholder]="'placeholders.e.g.inReview' | translate: {} : 'purchases'"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>{{ 'color' | translate: {} : 'purchases' }}</bifi-app-form-label>
            <input
              type="color"
              formControlName="color"
              class="h-10 w-full rounded border border-gray-300 cursor-pointer p-1"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>{{ 'order' | translate: {} : 'purchases' }}</bifi-app-form-label>
            <p-inputnumber formControlName="order" [min]="0" [placeholder]="'0'" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'placeholders.description' | translate: {} : 'purchases' }}
            </bifi-app-form-label>
            <textarea
              pTextarea
              formControlName="description"
              [placeholder]="'placeholders.description' | translate: {} : 'purchases'"
            ></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="md:col-span-2">
            <div class="flex items-center gap-3">
              <p-toggleswitch formControlName="isDefault" inputId="isDefault"></p-toggleswitch>
              <label for="isDefault" class="text-sm font-medium text-gray-700 cursor-pointer">
                {{ 'settings.defaultStage' | translate: {} : 'purchases' }}
              </label>
            </div>
            <p class="text-xs text-gray-500 mt-1">
              {{ 'settings.defaultStageDesc' | translate: {} : 'purchases' }}
            </p>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
