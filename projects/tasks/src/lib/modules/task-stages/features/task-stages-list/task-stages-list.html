<h1 class="text-2xl font-bold mb-4">{{ 'taskStages.title' | translate: {} : 'tasks' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'taskStages.addNew' | translate: {} : 'tasks'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'task-stages/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'taskStages.searchPlaceholder' | translate: {} : 'tasks'"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="stages"
  [scope]="'tasks'"
  [onClickRow]="gotoEditTaskStage"
  clickRowPermission="task-stages/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteStage(row._id)"
      resource="task-stages"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
