<h1 class="text-2xl font-bold mb-4">Task Types</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Type"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'task-types/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="columns" [data]="types">
  <ng-template #actions let-row>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      [routerLink]="['../edit/', row._id]"
      *bifiAppHasPermission="'task-types/update:view'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'task-types:delete:model'"
      severity="danger"
      label="Delete"
      (onClick)="deleteType(row._id)"
      icon="pi pi-trash"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
