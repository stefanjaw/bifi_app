<h1 class="text-2xl font-bold mb-4">Task Types</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Type"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'task-types/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="columns" [data]="types" [onClickRow]="gotoEditTaskType" clickRowPermission="task-types/update:view">
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteType(row._id)"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
