<h1 class="text-2xl font-bold mb-4">{{ 'taskTypes.title' | translate: {} : 'tasks' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'taskTypes.addNew' | translate: {} : 'tasks'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'task-types/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'taskTypes.searchPlaceholder' | translate: {} : 'tasks'"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="types"
  [scope]="'tasks'"
  [onClickRow]="gotoEditTaskType"
  clickRowPermission="task-types/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteType(row._id)"
      resource="task-types"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
