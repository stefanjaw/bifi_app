<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div
  class="absolute group h-8 rounded-md flex items-center cursor-pointer"
  [style.top.px]="index() * height() + 6"
  [style.left.px]="taskOffset()"
  [style.width.px]="taskWidth()"
  [class]="task().children.length > 0 ? 'bg-indigo-700' : 'bg-indigo-500'"
  (mousedown)="onMouseDown($event)"
  (click)="taskClicked.emit(task())"
>
  <div
    class="absolute top-0 left-0 h-full rounded-l-md bg-indigo-400"
    [style.width.%]="task().progress"
  ></div>
  <span class="relative text-white text-xs font-semibold px-2 truncate">
    {{ task().name }}
  </span>

  <!-- Resize Handle -->
  <div
    (mousedown)="onResizeMouseDown($event)"
    class="absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize opacity-0 group-hover:opacity-100 transition-opacity"
  >
    <div class="w-1 h-4 bg-white/50 rounded-full mx-auto my-2"></div>
  </div>
</div>
