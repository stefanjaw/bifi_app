<div class="flex-grow overflow-y-auto pt-4 pr-4">
  <div
    class="sticky top-0 bg-gray-50 z-10 grid grid-cols-12 h-12 items-center border-y border-gray-200 font-semibold text-gray-700 text-sm px-2"
  >
    <div class="col-span-5">Task Name</div>
    <div class="col-span-2">Start Date</div>
    <div class="col-span-2">End Date</div>
    <div class="col-span-2 text-center">Progress</div>
    <div class="col-span-1 text-center">Actions</div>
  </div>
  <div class="border-x border-b border-gray-200">
    @for (task of tasks(); track task.id) {
      <div
        class="grid grid-cols-12 items-center border-b border-gray-200 h-10 text-sm text-gray-700 hover:bg-indigo-50"
      >
        <div
          class="col-span-5 truncate flex items-center px-2 cursor-pointer"
          [style.padding-left.rem]="task.level * 1.5 + 0.5"
        >
          @if (task.children.length > 0) {
            <p-button
              variant="text"
              severity="secondary"
              icon="pi pi-chevron-right"
              class="transition-transform me-1"
              [class.rotate-90]="task.isExpanded"
              size="small"
              (onClick)="toggleExpand.emit(task.id); $event.stopPropagation()"
            ></p-button>
          } @else {
            <span class="w-5 mr-1"></span>
          }
          <span class="truncate">{{ task.name }}</span>
        </div>
        <div class="col-span-2 px-2 cursor-pointer">
          {{ task.start | date: 'MMM d yyyy, hh:mm a' }}
        </div>
        <div class="col-span-2 px-2 cursor-pointer">
          {{ task.end | date: 'MMM d yyyy, hh:mm a' }}
        </div>
        <div class="col-span-2 px-2 flex justify-center cursor-pointer">
          <div class="w-4/5 bg-gray-200 rounded-full h-2.5">
            <div class="bg-indigo-600 h-2.5 rounded-full" [style.width.%]="task.progress"></div>
          </div>
        </div>
        <div class="col-span-1 flex items-center justify-center space-x-1">
          <p-button
            title="Add Subtask"
            size="small"
            severity="secondary"
            icon="pi pi-plus"
            variant="text"
          ></p-button>
          <p-button
            title="Edit Task"
            size="small"
            severity="secondary"
            icon="pi pi-pencil"
            variant="text"
          ></p-button>
          <p-button
            title="Delete Task"
            size="small"
            severity="danger"
            icon="pi pi-trash"
            variant="text"
          ></p-button>
        </div>
      </div>
    }
  </div>
</div>
