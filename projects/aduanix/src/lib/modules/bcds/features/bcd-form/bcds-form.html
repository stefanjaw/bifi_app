<bifi-app-form-layout
  [title]="isUpdate() ? 'Update BCD' : `Create BCD for ${shipping()?.name}`"
  titlePosition="left"
  class="block px-4 bg-gray-50 py-4"
>
  @if (!isLoading()) {
    <form
      ngProjectAs="div"
      [formGroup]="form"
      bifiAppFormActionsHandler
      (appSubmit)="handleSubmit($event)"
      class="min-h-screen flex flex-col gap-4"
    >
      <bifi-app-form-actions
        [isSubmitting]="isSubmitLoading()"
        class="mb-4"
        [formChanged]="form.dirty"
        (cancelClicked)="goBack()"
        [showSave]="!isUploaded() || !isUpdate()"
      ></bifi-app-form-actions>

      @if (isUpdate() && !isUploaded()) {
        <p [bifiAppText]="'small'" class="text-orange-400">
          Once BCD is uploaded, it cannot be modified
        </p>
        <p-button
          [label]="isFtpSubmitLoading() ? 'Uploading...' : 'Upload FTP'"
          icon="pi pi-upload"
          (click)="uploadFtp()"
          [disabled]="isFtpSubmitLoading()"
          [type]="'button'"
        ></p-button>
      } @else if (isUpdate() && isUploaded()) {
        <p [bifiAppText]="'small'" class="text-green-400">BCD already uploaded</p>
        <p-button
          label="Download FTP"
          icon="pi pi-download"
          [type]="'button'"
          (onClick)="downloadFtp()"
        ></p-button>
      }

      <p-tabs value="0">
        <p-tablist>
          <p-tab value="0">
            <span class="p-tabheader-title">General</span>
          </p-tab>
          <p-tab value="1">
            <span class="p-tabheader-title">Records</span>
          </p-tab>
          <p-tab value="2">
            <span class="p-tabheader-title">Summary</span>
          </p-tab>
        </p-tablist>
        <p-tabpanels>
          <!-- GENERAL TAB-->
          <p-tabpanel value="0">
            <bifi-app-bcds-general-form></bifi-app-bcds-general-form>
          </p-tabpanel>

          <!-- RECORDS TAB -->
          <p-tabpanel value="1">
            <bifi-app-bcds-records-form [shipping]="shipping()"></bifi-app-bcds-records-form>
          </p-tabpanel>

          <!-- SUMMARY TAB -->
          <p-tabpanel value="2">
            <bifi-app-bcds-summary-form></bifi-app-bcds-summary-form>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </form>
  } @else {
    <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
  }
</bifi-app-form-layout>
