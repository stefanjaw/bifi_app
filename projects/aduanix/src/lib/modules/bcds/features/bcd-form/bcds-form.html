<bifi-app-form-layout title="BCD Form" titlePosition="left" class="block px-4 bg-gray-50 py-4">
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    <bifi-app-form-section title="Contact Section" id="general-contact-info" [ordinal]="1">
      <section class="w-full grid gap-3 sm:grid-cols-2">
        <div formGroupName="supplier">
          <bifi-app-form-field>
            <bifi-app-form-label>Supplier</bifi-app-form-label>
            <p-select
              formControlName="contactId"
              [options]="contactOptions()"
              optionLabel="name"
              optionValue="_id"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>

        <div formGroupName="importer">
          <bifi-app-form-field>
            <bifi-app-form-label>Importer</bifi-app-form-label>
            <p-select
              formControlName="contactId"
              [options]="contactOptions()"
              optionLabel="name"
              optionValue="_id"
              [filter]="true"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </section>
    </bifi-app-form-section>

    <bifi-app-form-section title="Transport " id="general-transport-info" [ordinal]="1">
      <div formGroupName="transport" class="w-full grid gap-3 sm:grid-cols-2">
        <!-- TYPE -->
        <bifi-app-form-field>
          <bifi-app-form-label>Type</bifi-app-form-label>
          @for (transport of transportTypeOptions; track transport.value) {
            <div class="flex align-items-center gap-2">
              <p-radioButton
                name="transportType"
                formControlName="type"
                [value]="transport.value"
              ></p-radioButton>
              <label>{{ transport.label }}</label>
            </div>
          }
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <!-- AIRCRAFT / VESSEL -->
        <bifi-app-form-field>
          <bifi-app-form-label>Aircraft or Vessel</bifi-app-form-label>
          <input type="text" formControlName="aircraftOrVessel" pInputText />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <!-- FLIGHT / VOYAGE NUMBER -->
        <bifi-app-form-field>
          <bifi-app-form-label>Flight</bifi-app-form-label>
          <input type="text" formControlName="flightOrVoyage" pInputText />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <!-- PORT OF ENTRY -->
        <bifi-app-form-field>
          <bifi-app-form-label>Port</bifi-app-form-label>
          <input type="text" formControlName="port" pInputText />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <!-- ARRIVAL DATE -->
        <bifi-app-form-field>
          <bifi-app-form-label>Arrival Date</bifi-app-form-label>
          <p-datepicker formControlName="arrivalDate" [showIcon]="true"></p-datepicker>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </div>
    </bifi-app-form-section>

    <bifi-app-form-section title="Manifest " id="manifest-info" [ordinal]="1">
      <div class="w-full grid gap-3 sm:grid-cols-2">
        <bifi-app-form-field>
          <bifi-app-form-label>Manifest #</bifi-app-form-label>
          <input type="text" formControlName="manifest" pInputText />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Bill of Lading</bifi-app-form-label>
          <input type="text" formControlName="masterBOLAWB" placeholder="Master BOL / AWB #" pInputText />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>House of Landing</bifi-app-form-label>
          <input type="text" formControlName="houseBOLAWB" placeholder="House BOL / AWB #" pInputText />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </div>
    </bifi-app-form-section>
  </form>
</bifi-app-form-layout>
