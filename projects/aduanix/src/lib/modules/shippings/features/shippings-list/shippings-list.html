<h1 class="text-2xl font-bold mb-4">Shippings</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Shippment"
    severity="secondary"
    icon="pi pi-plus"
    *bifiAppHasPermission="'shipping:create:view'"
    (onClick)="shippingFileFormDialog.openDialog()"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name, related contact, country and address"
  [searchFilters]="shippingFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="shippingColumns" [data]="shippings">
  <ng-template #actions let-row>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      variant="text"
      [routerLink]="['../edit/', row._id]"
      *bifiAppHasPermission="'shipping:update:view'"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'shipping:delete:model'"
      severity="danger"
      label="Delete"
      variant="text"
      (onClick)="deleteShipping(row._id)"
      icon="pi pi-trash"
    ></p-button>

    <p-button
      severity="secondary"
      label="Add BCD"
      icon="pi pi-plus"
      variant="text"
      [routerLink]="['../bcd/create', row._id]"
      *bifiAppHasPermission="'bcd:create:view'"
    ></p-button>
  </ng-template>

  <ng-template #expandContent let-element>
    <p-accordion class="w-full!">
      <p-accordion-panel value="0">
        <p-accordion-header>
          <span>
            <i class="pi pi-receipt"></i>
            Invoices
          </span>
        </p-accordion-header>
        <p-accordion-content>
          @for (invoice of element?.invoices; track $index) {
            <div
              class="flex flex-row justify-between items-center border-b-2 border-primary-100 pb-2"
            >
              @let tagConfig = getInvoiceStatusTagConfig(invoice?.status);

              <p>{{ invoice?.pdf?.file?.name || 'No name provided' }}</p>

              <p-tag [value]="tagConfig.value" [severity]="tagConfig.severity"></p-tag>

              @if (invoice?.pdf?.file?.fileId) {
                <p-button
                  severity="secondary"
                  icon="pi pi-download"
                  [variant]="'text'"
                  (onClick)="
                    fileResolver.downloadFileInBrowser({ id: invoice?.pdf?.file.fileId }, 'open')
                  "
                ></p-button>
              }
            </div>
          }
        </p-accordion-content>
      </p-accordion-panel>

      <p-accordion-panel value="1">
        <p-accordion-header>
          <span>
            <i class="pi pi-box"></i>
            BOLs
          </span>
        </p-accordion-header>
        <p-accordion-content>
          <p-button
            label="Upload BOL"
            severity="secondary"
            icon="pi pi-upload"
            [variant]="'text'"
          ></p-button>
        </p-accordion-content>
      </p-accordion-panel>

      <p-accordion-panel value="2">
        <p-accordion-header>
          <span>
            <i class="pi pi-file"></i>
            BCDs
          </span>
        </p-accordion-header>
        <p-accordion-content>Hello</p-accordion-content>
      </p-accordion-panel>
    </p-accordion>
  </ng-template>
</bifi-app-table-layout>

<bifi-app-shipping-file-form-dialog
  #shippingFileFormDialog
  (shippingCreated)="shippings.reload()"
></bifi-app-shipping-file-form-dialog>
