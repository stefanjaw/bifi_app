<p-dialog header="New invoice line" [(visible)]="dialogState" [modal]="true">
  <form
    [formGroup]="form"
    class="flex flex-col gap-6"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit()"
  >
    @if (!loading() && form) {
      <section class="w-full grid gap-3 sm:grid-cols-2">
        <bifi-app-form-field>
          <bifi-app-form-label>Line Number</bifi-app-form-label>
          <input
            pInputText
            formControlName="lineNumber"
            type="text"
            placeholder="Invoice line number"
          />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Description</bifi-app-form-label>
          <textarea pInputTextarea formControlName="description" rows="3" type="text"></textarea>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Origin Country</bifi-app-form-label>
          <p-select
            appendTo="body"
            formControlName="countryId"
            [options]="countries()"
            optionLabel="name"
            optionValue="_id"
            [filter]="true"
          ></p-select>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Quantity</bifi-app-form-label>
          <input pInputText formControlName="quantity" type="number" placeholder="Quantity" />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Price (In currency)</bifi-app-form-label>
          <input pInputText formControlName="price" type="text" placeholder="" />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </section>

      <bifi-app-form-actions
        (cancelClicked)="closeDialog()"
        cancelLabel="Cancel"
        [formChanged]="form.dirty"
      ></bifi-app-form-actions>
    }
  </form>
</p-dialog>
