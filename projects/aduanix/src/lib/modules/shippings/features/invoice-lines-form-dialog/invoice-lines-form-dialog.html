<p-dialog
  header="New invoice line"
  [(visible)]="dialogState"
  [modal]="true"
  styleClass="w-full max-w-full sm:max-w-sm md:max-w-md max-h-[90vh]"
>
  <form [formGroup]="form" class="flex flex-col gap-6" bifiAppFormActionsHandler>
    @if (!loading()) {
      <section class="w-full grid gap-3 sm:grid-cols-2">
        <bifi-app-form-field>
          <bifi-app-form-label>Line Number</bifi-app-form-label>
          <input
            pInputText
            formControlName="lineNumber"
            type="text"
            placeholder="Invoice line number"
          />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Description</bifi-app-form-label>
          <textarea pInputTextarea formControlName="description" rows="3" type="text"></textarea>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>Origin Country</bifi-app-form-label>
          <p-select
            formControlName="countryId"
            [options]="countries()"
            optionLabel="name"
            optionValue="_id"
            [filter]="true"
          ></p-select>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </section>
    }
  </form>
</p-dialog>
