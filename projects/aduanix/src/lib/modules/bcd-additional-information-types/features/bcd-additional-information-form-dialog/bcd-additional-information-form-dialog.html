<p-dialog
  [header]="'dialogHeader.newAdditionalInfo' | translate: {} : 'aduanix'"
  [(visible)]="dialogState"
  [modal]="true"
>
  @if (!loading()) {
    <form
      [formGroup]="form"
      class="flex flex-col gap-4"
      bifiAppFormActionsHandler
      (appSubmit)="handleSubmit()"
    >
      <section class="w-full grid gap-3 sm:grid-cols-2">
        <bifi-app-form-field>
          <bifi-app-form-label>{{ 'column.type' | translate: {} : 'aduanix' }}</bifi-app-form-label>
          <p-select
            appendTo="body"
            formControlName="type"
            [options]="additionalInformationTypeOptions()"
            optionLabel="name"
            optionValue="_id"
          ></p-select>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>

        <bifi-app-form-field>
          <bifi-app-form-label>
            {{ 'column.value' | translate: {} : 'aduanix' }}
          </bifi-app-form-label>
          <input
            pInputText
            formControlName="value"
            type="text"
            [placeholder]="'placeholder.value' | translate: {} : 'aduanix'"
          />
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </section>

      <bifi-app-form-actions
        (cancelClicked)="closeDialog()"
        [cancelLabel]="'button.cancel' | translate: {} : 'aduanix'"
        [formChanged]="form.dirty"
      ></bifi-app-form-actions>
    </form>
  } @else {
    <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
  }
</p-dialog>
