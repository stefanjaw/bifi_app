<bifi-app-form-layout
  [title]="'inventoryConfiguration' | translate: {} : 'inventory'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section
        [title]="'defaultWarehouse' | translate: {} : 'inventory'"
        id="default-warehouse"
        [ordinal]="1"
      >
        <p class="text-sm text-gray-500 mb-4">
          {{ 'inventorySettingsHelpText' | translate: {} : 'inventory' }}
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'defaultWarehouse' | translate: {} : 'inventory' }}
            </bifi-app-form-label>
            <p-select
              formControlName="defaultWarehouseId"
              [options]="warehouseOptions()"
              optionLabel="name"
              optionValue="_id"
              [placeholder]="'selectWarehouse' | translate: {} : 'inventory'"
              [showClear]="true"
              class="w-full"
              (onChange)="onWarehouseChange($event.value)"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'defaultLocation' | translate: {} : 'inventory' }}
            </bifi-app-form-label>
            <p-select
              formControlName="defaultLocationId"
              [options]="locationOptions()"
              optionLabel="name"
              optionValue="_id"
              [placeholder]="'selectLocation' | translate: {} : 'inventory'"
              [showClear]="true"
              [disabled]="!_selectedWarehouseId()"
              class="w-full"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-1.25'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
