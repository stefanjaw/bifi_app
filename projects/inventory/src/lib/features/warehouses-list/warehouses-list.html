<h1 class="text-2xl font-bold mb-4">Warehouses</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Warehouse"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/warehouses/new"
    *bifiAppHasPermission="'inventory/warehouses/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name or code"
  [searchFilters]="warehouseFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="warehouseColumns" [data]="entries">
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="View"
      icon="pi pi-eye"
      size="small"
      routerLink="/inventory/warehouses/{{ element._id }}"
    ></p-button>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      size="small"
      routerLink="/inventory/warehouses/{{ element._id }}/edit"
      *bifiAppHasPermission="'inventory/warehouses/update:view'"
    ></p-button>
    <p-button
      severity="danger"
      icon="pi pi-trash"
      size="small"
      (onClick)="delete(element._id)"
      *bifiAppHasPermission="'inventory/warehouses:delete:model'"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
