<h1 class="text-2xl font-bold mb-4">Warehouses</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Warehouse"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/warehouses/new"
    *bifiAppHasPermission="'inventory/warehouses/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name or code"
  [searchFilters]="warehouseFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [columns]="warehouseColumns"
  [data]="entries"
  [onClickRow]="gotoEditWarehouse"
  clickRowPermission="inventory/warehouses/update:view"
>
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="View"
      icon="pi pi-eye"
      size="small"
      routerLink="/inventory/warehouses/{{ element._id }}"
    ></p-button>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="inventory/warehouses"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
