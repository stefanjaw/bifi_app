<h1 class="text-2xl font-bold mb-4">Products</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Product"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/products/new"
    *bifiAppHasPermission="'inventory/products/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name or SKU"
  [searchFilters]="productFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="productColumns" [data]="entries">
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="View"
      icon="pi pi-eye"
      size="small"
      routerLink="/inventory/products/{{ element._id }}"
    ></p-button>
    <p-button
      severity="secondary"
      label="Edit"
      icon="pi pi-pencil"
      size="small"
      routerLink="/inventory/products/{{ element._id }}/edit"
      *bifiAppHasPermission="'inventory/products/update:view'"
    ></p-button>
    <p-button
      severity="danger"
      icon="pi pi-trash"
      size="small"
      (onClick)="delete(element._id)"
      *bifiAppHasPermission="'inventory/products:delete:model'"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
