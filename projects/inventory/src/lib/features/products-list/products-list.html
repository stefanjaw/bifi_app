<h1 class="text-2xl font-bold mb-4">Products</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Product"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/products/new"
    *bifiAppHasPermission="'inventory/products/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name or SKU"
  [searchFilters]="productFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="productColumns"
  [data]="entries"
  [onClickRow]="gotoEditProduct"
  clickRowPermission="inventory/products/update:view"
>
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      label="View"
      icon="pi pi-eye"
      size="small"
      routerLink="/inventory/products/{{ element._id }}"
    ></p-button>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="inventory/products"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
