<h1 class="text-2xl font-bold mb-4">{{ 'products' | translate: {} : 'inventory' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'newProduct' | translate: {} : 'inventory'"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/products/new"
    *bifiAppHasPermission="'inventory/products/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByNameOrSku' | translate: {} : 'inventory'"
  [searchFilters]="productFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="productColumns"
  [data]="entries"
  [onClickRow]="gotoProductDetail"
  clickRowPermission="inventory/products/read:view"
  [scope]="'inventory'"
>
  <ng-template #actions let-element>
    <p-button
      (click)="$event.stopPropagation()"
      severity="secondary"
      [label]="'edit' | translate: {} : 'inventory'"
      icon="pi pi-pencil"
      size="small"
      routerLink="/inventory/products/{{ element._id }}/edit"
      *bifiAppHasPermission="'inventory/products/update:view'"
    ></p-button>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="inventory/products"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
