<bifi-app-form-layout
  [title]="isUpdate() ? 'Edit Warehouse' : 'New Warehouse'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
      *bifiAppHasPermission="isUpdate() ? 'inventory/warehouses:update:model' : 'inventory/warehouses:create:model'"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Warehouse Information" id="warehouse-info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input pInputText formControlName="name" placeholder="Warehouse name" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Code *</bifi-app-form-label>
            <input pInputText formControlName="code" placeholder="e.g. WH-01" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Address</bifi-app-form-label>
            <input pInputText formControlName="address" placeholder="Full address" />
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
