<bifi-app-form-layout
  [title]="isUpdate() ? 'Edit Unit of Measure' : 'New Unit of Measure'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section title="Unit of Measure" id="uom-info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Name *</bifi-app-form-label>
            <input pInputText formControlName="name" placeholder="e.g. Kilogram, Box, Litre" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Symbol</bifi-app-form-label>
            <input pInputText formControlName="symbol" placeholder="e.g. kg, box, L" />
          </bifi-app-form-field>

          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>Category *</bifi-app-form-label>
            <p-select
              formControlName="categoryId"
              [options]="categories() || []"
              optionLabel="name"
              optionValue="_id"
              placeholder="Select a category"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
