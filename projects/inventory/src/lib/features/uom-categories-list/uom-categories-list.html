<h1 class="text-2xl font-bold mb-4">{{ 'uomCategories' | translate: {} : 'inventory' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'newCategory' | translate: {} : 'inventory'"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/uom-categories/new"
    *bifiAppHasPermission="'inventory/uom-categories/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByName' | translate: {} : 'inventory'"
  [searchFilters]="uomCategoryFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="uomCategoryColumns"
  [data]="entries"
  [scope]="'inventory'"
>
  <ng-template #actions let-element>
    <p-button
      severity="secondary"
      [label]="'edit' | translate: {} : 'inventory'"
      icon="pi pi-pencil"
      size="small"
      routerLink="/inventory/uom-categories/{{ element._id }}/edit"
      *bifiAppHasPermission="'inventory/uom-categories/update:view'"
    ></p-button>
    <p-button
      severity="danger"
      icon="pi pi-trash"
      size="small"
      (onClick)="delete(element._id)"
      *bifiAppHasPermission="'inventory/uom-categories:delete:model'"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
