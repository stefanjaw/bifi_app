<h1 class="text-2xl font-bold mb-4">{{ 'stockMovements' | translate: {} : 'inventory' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'newMovement' | translate: {} : 'inventory'"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/movements/new"
    *bifiAppHasPermission="'inventory/movements/create:view'"
  ></p-button>
  <p-button
    [label]="'transfer' | translate: {} : 'inventory'"
    severity="secondary"
    icon="pi pi-arrows-h"
    routerLink="/inventory/transfer"
    *bifiAppHasPermission="'inventory/transfer/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByTypeOrReference' | translate: {} : 'inventory'"
  [searchFilters]="movementFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="movementColumns"
  [data]="entries"
  [scope]="'inventory'"
></bifi-app-table-layout>
