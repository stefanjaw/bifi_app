<h1 class="text-2xl font-bold mb-4">{{ 'unitsOfMeasure' | translate: {} : 'inventory' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'newUnitOfMeasure' | translate: {} : 'inventory'"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/inventory/uoms/new"
    *bifiAppHasPermission="'inventory/uoms/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'searchByName' | translate: {} : 'inventory'"
  [searchFilters]="uomFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="uomColumns"
  [data]="entries"
  [onClickRow]="gotoEditUom"
  clickRowPermission="inventory/uoms/update:view"
  [scope]="'inventory'"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="delete(element._id)"
      resource="inventory/uoms"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
