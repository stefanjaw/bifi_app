<bifi-app-form-layout
  [title]="(isUpdate() ? 'editLocation' : 'newLocation') | translate: {} : 'inventory'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!isLoading()) {
      <bifi-app-form-section
        [title]="'locationInformation' | translate: {} : 'inventory'"
        id="location-info"
        [ordinal]="1"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field class="md:col-span-2">
            <bifi-app-form-label>
              {{ 'warehouse' | translate: {} : 'inventory' }} *
            </bifi-app-form-label>
            <p-select
              formControlName="warehouseId"
              [options]="warehouses() || []"
              optionLabel="name"
              optionValue="_id"
              [placeholder]="'selectWarehouse' | translate: {} : 'inventory'"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>{{ 'name' | translate: {} : 'inventory' }} *</bifi-app-form-label>
            <input
              pInputText
              formControlName="name"
              [placeholder]="'locationNamePlaceholder' | translate: {} : 'inventory'"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>{{ 'code' | translate: {} : 'inventory' }} *</bifi-app-form-label>
            <input
              pInputText
              formControlName="code"
              [placeholder]="'locationCodePlaceholder' | translate: {} : 'inventory'"
            />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'capacity' | translate: {} : 'inventory' }}
            </bifi-app-form-label>
            <p-inputNumber
              formControlName="capacity"
              [min]="0"
              [placeholder]="'unlimitedCapacity' | translate: {} : 'inventory'"
            ></p-inputNumber>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    }

    @if (isLoading()) {
      <p-progress-bar mode="indeterminate" [style]="{ height: '5px' }"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
