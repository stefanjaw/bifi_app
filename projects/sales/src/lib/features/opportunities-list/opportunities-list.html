<p-toast></p-toast>
<h1 class="text-2xl font-bold mb-4">Opportunities</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Opportunity"
    severity="secondary"
    icon="pi pi-plus"
    routerLink="/sales/opportunities/new"
    *bifiAppHasPermission="'sales/opportunities/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by title, company, contact or stage"
  [searchFilters]="crmFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [columns]="crmColumns"
  [data]="entries"
  [onClickRow]="editOpportunity"
  clickRowPermission="sales/opportunities/update:view"
>
  <ng-template #actions let-element>
    <p-button
      *bifiAppHasPermission="'sales:update:model'"
      severity="success"
      label="Won"
      icon="pi pi-check"
      size="small"
      [loading]="markingId() === element._id"
      (onClick)="markWon($event, element)"
    ></p-button>
    <p-button
      *bifiAppHasPermission="'sales:update:model'"
      severity="danger"
      label="Lost"
      icon="pi pi-times"
      size="small"
      [loading]="markingId() === element._id"
      (onClick)="markLost($event, element)"
    ></p-button>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteEntry(element._id)"
      resource="sales/opportunities"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
