<h1 class="text-2xl font-bold mb-4">Sales Targets</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Target"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'sales/targets/create:view'"
  ></p-button>
</div>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="salesTargetColumns"
  [data]="entries"
  [onClickRow]="gotoEditTarget"
  clickRowPermission="sales/targets/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteEntry(element._id)"
      resource="sales/targets"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
