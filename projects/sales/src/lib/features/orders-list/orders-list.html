<h1 class="text-2xl font-bold mb-4">Sales Orders</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="New Order"
    severity="secondary"
    icon="pi pi-plus"
    (onClick)="navigateToNew()"
    *bifiAppHasPermission="'sales/orders/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by deal, company or contact"
  [searchFilters]="salesOrderFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [columns]="salesOrderColumns"
  [data]="entries"
  [onClickRow]="onClickRow"
  clickRowPermission="sales/orders/update:view"
>
  <ng-template #actions let-element>
    <p-button
      *bifiAppHasPermission="'sales-orders:delete:model'"
      severity="danger"
      icon="pi pi-trash"
      size="small"
      (onClick)="deleteEntry(element._id)"
    ></p-button>
  </ng-template>
</bifi-app-table-layout>
