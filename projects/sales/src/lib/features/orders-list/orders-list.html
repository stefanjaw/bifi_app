<h1 class="text-2xl font-bold mb-4">{{ 'sales.orders.title' | translate: {} : 'sales' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'sales.orders.new' | translate: {} : 'sales'"
    severity="secondary"
    icon="pi pi-plus"
    (onClick)="navigateToNew()"
    *bifiAppHasPermission="'sales/orders/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'sales.orders.searchPlaceholder' | translate: {} : 'sales'"
  [searchFilters]="salesOrderFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="salesOrderColumns"
  [data]="entries"
  [scope]="'sales'"
  [onClickRow]="onClickRow"
  clickRowPermission="sales/orders/update:view"
>
  <ng-template #actions let-element>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteEntry(element._id)"
      resource="sales/orders"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
