<h1 class="text-2xl font-bold mb-4">
  {{ 'sales.pricing.historyTitle' | translate: {} : 'sales' }}
</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'sales.pricing.newEstimate' | translate: {} : 'sales'"
    severity="secondary"
    icon="pi pi-plus"
    (onClick)="navigateToNew()"
    *bifiAppHasPermission="'pricing-estimates/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'sales.pricing.searchPlaceholder' | translate: {} : 'sales'"
  [searchFilters]="filters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [columns]="columns"
  [data]="entries"
  [onClickRow]="onClickRow"
  [scope]="'sales'"
  clickRowPermission="pricing-estimates/read:view"
></bifi-app-table-layout>
