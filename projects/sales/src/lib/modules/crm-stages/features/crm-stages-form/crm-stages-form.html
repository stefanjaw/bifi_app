<bifi-app-form-layout
  title="{{ isUpdate() ? 'Update' : 'Create' }} CRM Stage"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      (cancelClicked)="goBack()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section title="Stage Information" id="stage-info" [ordinal]="1">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>Name</bifi-app-form-label>
            <input pInputText formControlName="name" type="text" placeholder="e.g. Prospecting" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Color</bifi-app-form-label>
            <input type="color" formControlName="color" class="h-10 w-full rounded border border-gray-300 cursor-pointer p-1" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Order</bifi-app-form-label>
            <p-inputnumber formControlName="order" [min]="0" placeholder="0" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Default Probability (%)</bifi-app-form-label>
            <p-inputnumber formControlName="probability" [min]="0" [max]="100" placeholder="0" />
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <bifi-app-form-label>Description</bifi-app-form-label>
            <textarea pInputTextarea formControlName="description" placeholder="Description"></textarea>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>

      <bifi-app-form-section title="Stage Flags" id="stage-flags" [ordinal]="2">
        <div class="flex flex-col gap-6">
          <bifi-app-form-field>
            <div class="flex items-center gap-3">
              <p-checkbox formControlName="isWon" [binary]="true" inputId="isWon"></p-checkbox>
              <label for="isWon" class="cursor-pointer font-medium text-gray-700">
                Mark deals in this stage as <span class="text-green-600 font-semibold">Won</span>
              </label>
            </div>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>

          <bifi-app-form-field>
            <div class="flex items-center gap-3">
              <p-checkbox formControlName="isLost" [binary]="true" inputId="isLost"></p-checkbox>
              <label for="isLost" class="cursor-pointer font-medium text-gray-700">
                Mark deals in this stage as <span class="text-red-600 font-semibold">Lost</span>
              </label>
            </div>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>
    } @else if (error()) {
      <p>Something went wrong... {{ error() }}</p>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
