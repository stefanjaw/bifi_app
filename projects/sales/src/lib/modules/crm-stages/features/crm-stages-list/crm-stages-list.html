<h1 class="text-2xl font-bold mb-4">CRM Stages</h1>

<div class="flex gap-2 mb-4">
  <p-button
    label="Add New Stage"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'crm-stages/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  label="Search by name"
  [searchFilters]="crmStageFilters"
></bifi-app-search-bar>

<bifi-app-table-layout [columns]="crmStageColumns" [data]="crmStages"[onClickRow]="goToEditCrmStage" clickRowPermission="crm-stages/update:view"  >
  <ng-template #actions let-row>

    <p-button

      severity="danger"
      label="Delete"
      (onClick)="deleteCrmStage(row._id)"
      icon="pi pi-trash"
