<h1 class="text-2xl font-bold mb-4">{{ 'sales.crmStages.title' | translate: {} : 'sales' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'sales.crmStages.addNew' | translate: {} : 'sales'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'crm-stages/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'sales.crmStages.searchPlaceholder' | translate: {} : 'sales'"
  [searchFilters]="crmStageFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'sales'"
  [columns]="crmStageColumns"
  [data]="crmStages"
  [onClickRow]="goToEditCrmStage"
  clickRowPermission="crm-stages/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteCrmStage(row._id)"
      resource="crm-stages"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
