<bifi-app-form-layout
  [title]="'sales.settings.title' | translate: {} : 'sales'"
  titlePosition="center"
  class="block px-4 bg-gray-50 py-4"
>
  <form
    ngProjectAs="div"
    [formGroup]="form"
    bifiAppFormActionsHandler
    (appSubmit)="handleSubmit($event)"
    class="min-h-screen flex flex-col gap-6"
  >
    <bifi-app-form-actions
      [isSubmitting]="isSubmitLoading()"
      class="mb-4"
      [formChanged]="form.dirty"
    ></bifi-app-form-actions>

    @if (!loading()) {
      <bifi-app-form-section
        [title]="'sales.settings.documentSequences' | translate: {} : 'sales'"
        id="document-sequences"
        [ordinal]="1"
      >
        <p class="text-sm text-gray-500 mb-4">
          {{ 'sales.settings.sequenceDescription' | translate: {} : 'sales' }}
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <bifi-app-form-field>
            <bifi-app-form-label>
              {{ 'sales.settings.orderSequence' | translate: {} : 'sales' }}
            </bifi-app-form-label>
            <p-select
              formControlName="orderSequence"
              [options]="sequenceOptions()"
              optionLabel="name"
              optionValue="_id"
              [placeholder]="'sales.settings.selectSequence' | translate: {} : 'sales'"
              [showClear]="true"
              class="w-full"
            ></p-select>
            <bifi-app-form-error></bifi-app-form-error>
          </bifi-app-form-field>
        </div>
      </bifi-app-form-section>

      <bifi-app-form-section
        [title]="'sales.settings.additionalInformation' | translate: {} : 'sales'"
        id="additional-info"
        [ordinal]="2"
      >
        <bifi-app-form-field>
          <bifi-app-form-label>
            {{ 'sales.settings.description' | translate: {} : 'sales' }}
          </bifi-app-form-label>
          <textarea
            pInputTextarea
            formControlName="description"
            [placeholder]="'sales.settings.notesPlaceholder' | translate: {} : 'sales'"
            rows="3"
          ></textarea>
          <bifi-app-form-error></bifi-app-form-error>
        </bifi-app-form-field>
      </bifi-app-form-section>
    } @else {
      <p-progress-bar mode="indeterminate" [className]="'w-full h-[5px]'"></p-progress-bar>
    }
  </form>
</bifi-app-form-layout>
