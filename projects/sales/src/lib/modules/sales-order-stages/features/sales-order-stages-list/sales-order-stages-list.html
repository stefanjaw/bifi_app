<h1 class="text-2xl font-bold mb-4">{{ 'sales.orderStages.title' | translate: {} : 'sales' }}</h1>

<div class="flex gap-2 mb-4">
  <p-button
    [label]="'sales.orderStages.addNew' | translate: {} : 'sales'"
    severity="secondary"
    icon="pi pi-plus"
    [routerLink]="['../create']"
    *bifiAppHasPermission="'sales-order-stages/create:view'"
  ></p-button>
</div>

<bifi-app-search-bar
  [label]="'sales.crmStages.searchPlaceholder' | translate: {} : 'sales'"
  [searchFilters]="salesOrderStageFilters"
></bifi-app-search-bar>

<bifi-app-table-layout
  [infiniteScroll]="true"
  [scope]="'sales'"
  [columns]="salesOrderStageColumns"
  [data]="stages"
  [onClickRow]="goToEditStage"
  clickRowPermission="sales-order-stages/update:view"
>
  <ng-template #actions let-row>
    <bifi-app-buttons-actions
      (deleteClicked)="deleteStage(row._id)"
      resource="sales-order-stages"
    ></bifi-app-buttons-actions>
  </ng-template>
</bifi-app-table-layout>
